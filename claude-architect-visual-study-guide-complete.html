<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Claude Architect Domain 1–5 完整視覺解說">
  <title>Claude Architect 完整視覺解說</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f3efe7, #100f0e);
      --paper: light-dark(#fffdf9, #1a1816);
      --soft: light-dark(#ece6dc, #27231f);
      --ink: light-dark(#211e1a, #f7f0e7);
      --muted: light-dark(#6e665d, #b9afa4);
      --line: light-dark(#d9d0c3, #3d3630);
      --accent: light-dark(#d65c34, #ff8b63);
      --accent-soft: light-dark(#f7ded3, #4b291f);
      --blue: light-dark(#3478a8, #79c4f4);
      --blue-soft: light-dark(#dcebf5, #183548);
      --green: light-dark(#427b55, #7ed09a);
      --green-soft: light-dark(#deece2, #1d3a27);
      --purple: light-dark(#735796, #c3a1eb);
      --purple-soft: light-dark(#e9e0f1, #342443);
      --shadow: 0 20px 55px light-dark(rgb(61 47 32 / 10%), rgb(0 0 0 / 30%));
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 84% 4%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 34rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }
    button { font: inherit; }
    h1, h2, h3, p { margin: 0; }

    .shell { display: grid; grid-template-columns: 292px minmax(0, 1fr); min-height: 100vh; }
    .side {
      position: sticky;
      top: 0;
      min-width: 0;
      max-width: 100%;
      height: 100vh;
      padding: 26px 20px;
      border-right: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      backdrop-filter: blur(18px);
      z-index: 10;
    }
    .brand { display: flex; gap: 12px; align-items: center; padding: 0 8px 24px; }
    .mark {
      width: 46px; height: 46px; display: grid; place-items: center;
      border-radius: 15px; background: var(--accent); color: #fff; font-weight: 900;
      box-shadow: 0 10px 25px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .brand strong, .brand small { display: block; }
    .brand strong { font-size: 18px; }
    .brand small { margin-top: 3px; color: var(--muted); }
    .domain-nav { display: grid; gap: 8px; min-width: 0; max-width: 100%; }
    .domain-btn {
      width: 100%; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto;
      gap: 10px; align-items: center; padding: 11px; border: 0; border-radius: 16px;
      background: transparent; color: var(--ink); text-align: left; cursor: pointer;
    }
    .domain-btn:hover { background: var(--soft); }
    .domain-btn[aria-current="true"] { background: var(--ink); color: var(--bg); }
    .num { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: color-mix(in srgb, currentColor 10%, transparent); font-weight: 900; }
    .domain-name { font-size: 13px; font-weight: 750; line-height: 1.25; }
    .weight { font-size: 11px; opacity: .62; }
    .side-foot { position: absolute; left: 28px; right: 28px; bottom: 24px; color: var(--muted); font-size: 12px; line-height: 1.55; }

    .main { min-width: 0; padding: 32px clamp(18px, 4vw, 62px) 56px; }
    .head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 20px; }
    .eyebrow { margin-bottom: 6px; color: var(--accent); font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(25px, 3vw, 42px); line-height: 1.12; letter-spacing: -.035em; }
    .progress { flex: 0 0 auto; padding: 8px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 900; }
    .head-actions { display: flex; align-items: center; gap: 10px; }
    .language-toggle { display: flex; flex: 0 0 auto; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); }
    .language-toggle button { padding: 6px 10px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; font-weight: 800; white-space: nowrap; }
    .language-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    .slide-nav { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: thin; }
    .slide-btn { flex: 0 0 auto; padding: 9px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--muted); cursor: pointer; }
    .slide-btn:hover { border-color: var(--accent); color: var(--ink); }
    .slide-btn[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }

    .slide {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .hero { position: relative; min-height: 590px; padding: clamp(24px, 4vw, 52px); isolation: isolate; }
    .hero::before { content: ""; position: absolute; z-index: -1; width: 370px; height: 370px; right: -110px; top: -140px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 9%, transparent); }
    .hero-copy { text-align: center; }
    .kicker { color: var(--accent); font-size: 12px; font-weight: 900; letter-spacing: .08em; }
    .hero h2 { max-width: 850px; margin: 8px auto 10px; font-size: clamp(24px, 3vw, 38px); line-height: 1.16; letter-spacing: -.025em; }
    .hero-copy p { max-width: 720px; margin: auto; color: var(--muted); font-size: clamp(14px, 1.6vw, 18px); line-height: 1.55; }
    .visual { min-height: 390px; display: grid; place-items: center; margin-top: 16px; animation: rise .25s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .flow, .stack, .split, .hub, .cycle, .funnel, .shield { width: min(900px, 100%); }
    .flow { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .node, .stack-row, .panel, .hub-node, .cycle-node, .chip { border: 1px solid var(--line); background: var(--soft); }
    .node { min-width: 135px; min-height: 116px; display: grid; place-items: center; align-content: center; gap: 5px; padding: 18px; border-radius: 26px; text-align: center; }
    .node strong, .stack-row strong, .panel strong, .hub-node strong, .cycle-node strong, .core strong { font-size: clamp(16px, 2vw, 22px); }
    .node small, .stack-row small, .panel small, .hub-node small, .cycle-node small, .chip small { color: var(--muted); }
    .node.key, .hub-center, .core { border-color: var(--ink); background: var(--ink); color: var(--bg); }
    .arrow { color: var(--accent); font-size: 28px; font-weight: 900; }

    .split { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: stretch; }
    .panel { min-height: 250px; display: grid; place-items: center; align-content: center; gap: 12px; padding: 30px; border-radius: 32px; text-align: center; }
    .panel:first-child { background: var(--accent-soft); }
    .panel:last-child { background: var(--blue-soft); }
    .vs { align-self: center; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 900; }

    .stack { display: grid; gap: 11px; }
    .stack-row { min-height: 68px; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 15px; padding: 13px 18px; border-radius: 19px; }
    .stack-row:nth-child(1) { margin-inline: 12%; background: var(--accent-soft); }
    .stack-row:nth-child(2) { margin-inline: 8%; background: var(--blue-soft); }
    .stack-row:nth-child(3) { margin-inline: 4%; background: var(--green-soft); }
    .stack-row:nth-child(4) { background: var(--purple-soft); }
    .idx { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: color-mix(in srgb, var(--ink) 8%, transparent); font-weight: 900; }

    .hub { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-areas: ". top ." "left center right" ". bottom ."; gap: 14px; align-items: center; }
    .hub-node { min-height: 88px; display: grid; place-items: center; align-content: center; gap: 4px; padding: 14px; border-radius: 22px; text-align: center; }
    .hub-node:nth-child(1) { grid-area: top; } .hub-node:nth-child(2) { grid-area: left; } .hub-node:nth-child(3) { grid-area: center; min-height: 156px; border-radius: 50%; } .hub-node:nth-child(4) { grid-area: right; } .hub-node:nth-child(5) { grid-area: bottom; }

    .cycle { position: relative; width: min(560px, 100%); aspect-ratio: 1.45; }
    .cycle::before { content: ""; position: absolute; inset: 12% 20%; border: 5px solid var(--accent-soft); border-radius: 50%; }
    .cycle-node { position: absolute; width: 130px; min-height: 90px; display: grid; place-items: center; align-content: center; gap: 4px; padding: 11px; border-radius: 22px; text-align: center; }
    .cycle-node:nth-child(1) { left: 50%; top: 0; transform: translateX(-50%); background: var(--accent-soft); }
    .cycle-node:nth-child(2) { right: 0; top: 50%; transform: translateY(-50%); background: var(--blue-soft); }
    .cycle-node:nth-child(3) { left: 50%; bottom: 0; transform: translateX(-50%); background: var(--green-soft); }
    .cycle-node:nth-child(4) { left: 0; top: 50%; transform: translateY(-50%); background: var(--purple-soft); }
    .cycle-core { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--accent); font-weight: 900; text-align: center; }

    .funnel { display: grid; justify-items: center; gap: 10px; }
    .funnel-row { min-height: 62px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 17px; background: var(--soft); text-align: center; font-weight: 850; }
    .funnel-row:nth-child(1) { width: 100%; background: var(--accent-soft); } .funnel-row:nth-child(2) { width: 82%; background: var(--blue-soft); } .funnel-row:nth-child(3) { width: 64%; background: var(--green-soft); } .funnel-row:nth-child(4) { width: 46%; background: var(--ink); color: var(--bg); }

    .shield { position: relative; min-height: 385px; display: grid; place-items: center; }
    .shield-shape { position: absolute; width: min(520px, 80%); height: 345px; clip-path: polygon(50% 0,95% 16%,88% 70%,72% 90%,50% 100%,28% 90%,12% 70%,5% 16%); background: var(--accent-soft); }
    .core { z-index: 2; width: 178px; height: 178px; display: grid; place-items: center; align-content: center; gap: 6px; border-radius: 50%; text-align: center; }
    .chips { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .chip { position: absolute; min-width: 132px; padding: 11px 14px; border-radius: 15px; background: var(--paper); text-align: center; font-weight: 850; }
    .chip strong, .chip small { display: block; } .chip small { margin-top: 3px; }
    .chip:nth-child(1) { left: 9%; top: 23%; } .chip:nth-child(2) { right: 9%; top: 23%; } .chip:nth-child(3) { left: 13%; bottom: 17%; } .chip:nth-child(4) { right: 13%; bottom: 17%; }

    .explain { padding: clamp(24px, 4vw, 44px); border-top: 1px solid var(--line); background: color-mix(in srgb, var(--soft) 48%, var(--paper)); }
    .explain-lead { max-width: 900px; font-size: clamp(17px, 2vw, 22px); line-height: 1.65; }
    .detail-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; margin-top: 22px; }
    .detail { padding: 20px; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); }
    .detail h3 { margin-bottom: 10px; color: var(--accent); font-size: 13px; letter-spacing: .06em; }
    .detail p, .detail li { color: var(--muted); line-height: 1.65; }
    .detail ul { margin: 0; padding-left: 20px; }
    .trap { border-color: color-mix(in srgb, var(--accent) 48%, var(--line)); background: var(--accent-soft); }
    .trap p { color: var(--ink); }
    .example code { display: block; margin-top: 10px; padding: 12px 14px; overflow-wrap: anywhere; border-radius: 12px; background: var(--ink); color: var(--bg); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; }
    .learning-extras { padding: clamp(24px, 4vw, 44px); border-top: 1px solid var(--line); background: var(--paper); }
    .extras-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 18px; }
    .extras-head p { margin-top: 5px; color: var(--muted); line-height: 1.5; }
    .extras-badge { flex: 0 0 auto; padding: 7px 10px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-size: 12px; font-weight: 850; }
    .accordion-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .accordion { border: 1px solid var(--line); border-radius: 18px; background: color-mix(in srgb, var(--soft) 45%, var(--paper)); overflow: hidden; }
    .accordion summary { display: flex; justify-content: space-between; gap: 12px; padding: 16px 18px; cursor: pointer; font-weight: 850; list-style: none; }
    .accordion summary::-webkit-details-marker { display: none; }
    .accordion summary::after { content: '+'; color: var(--accent); font-size: 20px; }
    .accordion[open] summary::after { content: '−'; }
    .accordion-body { display: grid; gap: 10px; padding: 0 18px 18px; }
    .term-row { padding: 16px 18px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); }
    .term-row-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .term-row-head strong { color: var(--accent); font-size: 15px; }
    .term-tag { font-size: 11px; font-weight: 850; letter-spacing: .04em; padding: 2px 9px; border-radius: 999px; color: var(--muted); background: var(--soft); }
    .term-block { margin-top: 10px; }
    .term-block:first-of-type { margin-top: 0; }
    .term-block-label { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 850; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
    .term-block-label .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
    .term-block.what .dot { background: var(--blue); }
    .term-block.why .dot { background: var(--accent); }
    .term-block.pitfall .dot { background: var(--accent); }
    .term-block.example .dot { background: var(--green); }
    .term-row p, .faq-row p { color: var(--muted); line-height: 1.7; }
    .term-block.pitfall { padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); }
    .term-block.pitfall p { color: var(--ink); }
    .term-block.example { padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--green-soft) 55%, var(--paper)); }
    .faq-row { padding: 13px 0; border-top: 1px solid var(--line); }
    .faq-row:first-child { border-top: 0; padding-top: 0; }
    .faq-row strong { display: block; margin-bottom: 6px; }
    .quiz-area { margin-top: 20px; }
    .quiz-card { padding: clamp(18px, 3vw, 28px); border: 1px solid var(--line); border-radius: 22px; background: color-mix(in srgb, var(--blue-soft) 42%, var(--paper)); }
    .quiz-meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
    .quiz-source { color: var(--blue); font-weight: 850; }
    .quiz-question { font-size: clamp(17px, 2vw, 21px); line-height: 1.55; font-weight: 780; }
    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .quiz-option { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; min-height: 58px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 15px; background: var(--paper); color: var(--ink); text-align: left; cursor: pointer; }
    .quiz-option:hover:not(:disabled) { border-color: var(--blue); }
    .quiz-option:disabled { cursor: default; }
    .quiz-letter { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--soft); font-weight: 900; }
    .quiz-option.correct { border-color: var(--green); background: var(--green-soft); }
    .quiz-option.correct .quiz-letter { background: var(--green); color: var(--bg); }
    .quiz-option.wrong { border-color: var(--accent); background: var(--accent-soft); }
    .quiz-option.wrong .quiz-letter { background: var(--accent); color: #fff; }
    .quiz-result { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .quiz-result strong.correct-text { color: var(--green); }
    .quiz-result strong.wrong-text { color: var(--accent); }
    .quiz-action { padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); cursor: pointer; }
    .quiz-explanation { margin-top: 12px; padding: 14px 16px; border-left: 4px solid var(--blue); border-radius: 12px; background: var(--paper); color: var(--muted); line-height: 1.65; }
    .pager { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 18px; color: var(--muted); font-size: 13px; }
    .pager-actions { display: flex; gap: 8px; }
    .pager button { min-width: 46px; height: 42px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); cursor: pointer; }
    .pager button:hover { border-color: var(--accent); }

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .visual { animation: none; } }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .side { height: auto; padding: 14px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { padding: 0 0 10px; } .mark { width: 38px; height: 38px; border-radius: 12px; }
      .domain-nav { display: flex; overflow-x: auto; padding-bottom: 4px; }
      .domain-btn { flex: 0 0 210px; grid-template-columns: 34px minmax(0,1fr); padding: 9px; }
      .num { width: 34px; height: 34px; } .weight, .side-foot { display: none; }
      .main { padding-top: 24px; } .hero { min-height: 560px; }
    }
    @media (max-width: 640px) {
      .main { padding-inline: 14px; } .head { align-items: start; } .head-actions { flex-direction: column-reverse; align-items: end; }
      .slide { border-radius: 24px; } .hero { min-height: 520px; padding: 24px 16px; }
      .visual { min-height: 325px; }
      .flow { flex-wrap: wrap; gap: 7px; } .node { min-width: 108px; min-height: 88px; padding: 10px; border-radius: 18px; } .arrow { font-size: 19px; }
      .split { grid-template-columns: 1fr; gap: 9px; } .panel { min-height: 120px; padding: 17px; border-radius: 21px; } .vs { margin: auto; }
      .stack-row { grid-template-columns: 42px 1fr; gap: 9px; padding: 10px 11px; } .stack-row small { grid-column: 2; } .stack-row:nth-child(n) { margin-inline: 0; }
      .hub { gap: 7px; } .hub-node { min-height: 70px; padding: 8px; border-radius: 17px; } .hub-node:nth-child(3) { min-height: 108px; }
      .cycle { aspect-ratio: 1.1; } .cycle::before { inset: 18% 20%; } .cycle-node { width: 102px; min-height: 72px; padding: 7px; border-radius: 17px; }
      .shield { min-height: 325px; } .shield-shape { width: 94%; height: 295px; } .core { width: 128px; height: 128px; }
      .chip { min-width: 100px; padding: 8px; font-size: 12px; } .chip:nth-child(1) { left: 0; top: 20%; } .chip:nth-child(2) { right: 0; top: 20%; } .chip:nth-child(3) { left: 2%; bottom: 14%; } .chip:nth-child(4) { right: 2%; bottom: 14%; }
      .detail-grid { grid-template-columns: 1fr; } .detail { padding: 17px; }
      .accordion-grid, .quiz-options { grid-template-columns: 1fr; }
      .term-row { padding: 13px 14px; }
      .extras-head, .quiz-result { align-items: start; }
      .pager > span { display: none; } .pager-actions { margin-left: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side" aria-label="Domain 導覽">
      <div class="brand"><div class="mark">C</div><div><strong>Claude Architect</strong><small id="brand-sub">完整視覺解說</small></div></div>
      <nav class="domain-nav" id="domain-nav"></nav>
      <p class="side-foot" id="side-foot">完整版｜圖解＋白話說明<br>共 36 張 Slides</p>
    </aside>
    <main class="main">
      <header class="head">
        <div><p class="eyebrow" id="domain-label"></p><h1 id="domain-title"></h1></div>
        <div class="head-actions"><div class="language-toggle" aria-label="Language"><button id="lang-zh" aria-pressed="true">繁中</button><button id="lang-en" aria-pressed="false">EN</button></div><span class="progress" id="progress"></span></div>
      </header>
      <nav class="slide-nav" id="slide-nav" aria-label="本 Domain Slides"></nav>
      <article class="slide" aria-live="polite">
        <section class="hero">
          <div class="hero-copy"><span class="kicker" id="kicker"></span><h2 id="title"></h2><p id="subtitle"></p></div>
          <div class="visual" id="visual"></div>
        </section>
        <section class="explain">
          <p class="explain-lead" id="plain"></p>
          <div class="detail-grid">
            <section class="detail"><h3 id="label-points">你要記得</h3><ul id="points"></ul></section>
            <section class="detail example"><h3 id="label-example">實務例子</h3><p id="example"></p><code id="code"></code></section>
            <section class="detail trap"><h3 id="label-trap">常見陷阱</h3><p id="trap"></p></section>
            <section class="detail"><h3 id="label-memory">一句話記憶</h3><p id="memory"></p></section>
          </div>
        </section>
        <section class="learning-extras">
          <div class="extras-head">
            <div><h2 id="extras-title">深入理解與考試練習</h2><p id="extras-sub">先展開名詞與 FAQ，再用模擬題確認是否真的理解。</p></div>

      { number: 1, weight: '27%', title: 'Agentic Architecture & Orchestration', slides: [
        {tab:'Agent',k:'先懂差別',t:'Chatbot 回答；Agent 會行動',s:'Agent 不只產生文字，還會反覆使用工具完成目標。',kind:'flow',nodes:[['你','目標'],['Claude Agent','判斷'],['Tools','行動'],['成果','交付']],key:1,plain:'把一般 Chatbot 想成「回答問題的人」，把 Agent 想成「接下任務並去跑腿的人」。Agent 會自己判斷下一步、呼叫工具、讀取結果，直到任務完成或碰到停止條件。',points:['目標通常比單一問題更開放。','工具讓模型能查資料、改檔案或呼叫 API。','真正的控制權仍在外部 Orchestrator。'],example:'你說「整理專案並修好測試」，Agent 可能先讀檔、跑測試、修改程式，再重跑驗證。',code:'Goal → Decide → Tool → Result → Repeat',trap:'不要把「回答很長」誤認為 Agent。關鍵是它是否能根據環境回饋持續採取行動。',memory:'Chatbot 給答案；Agent 把事情做完。'},
        {tab:'Loop',k:'運作核心',t:'Agent 的心臟是一個 Loop',s:'Think → Act → Observe → Update，反覆前進。',kind:'cycle',nodes:[['判斷','Think'],['行動','Act'],['觀察','Observe'],['更新','Context']],core:'Loop',plain:'每一圈都先根據目前 Context 判斷下一步，接著透過 Tool 對外行動，再把 Tool result 放回 Context。這就是 ReAct 類型的基本節奏。',points:['每一圈都可能產生新的 Tool call。','完成、超時、超預算或錯誤都應停止。','停止條件要由系統明確定義。'],example:'搜尋資料後發現缺少日期，下一圈就改查行事曆，而不是直接猜。',code:'while (!done) { decide(); act(); observe(); }',trap:'只叫模型「自己判斷何時停止」不夠可靠，可能無限重試或消耗過多成本。',memory:'Loop 負責前進；Guardrail 負責踩煞車。'},
        {tab:'API vs SDK',k:'架構選擇',t:'Loop 要住在哪裡？',s:'Messages API 由你控制；Agent SDK 幫你包好。',kind:'split',nodes:[['Messages API','自己寫 Loop・Session'],['Agent SDK','Loop・Tools・Session 內建']],plain:'Messages API 是 stateless：每次呼叫都要由你的應用程式帶回必要歷史。Agent SDK 則提供較完整的 Agent loop、工具、權限、Hooks、Subagents 與磁碟 Session。',points:['要高度客製與跨主機狀態：Messages API 較彈性。','要快速建立 Claude Code 類 Agent：Agent SDK 較省工。','兩者都仍需要外部預算與安全政策。'],example:'客服分類流程可能用 Messages API；能讀寫 Repo 的開發 Agent 適合 Agent SDK。',code:'Messages API = DIY control plane\nAgent SDK = batteries included',trap:'Agent SDK 幫你管理對話，不代表自動備份所有檔案變更。',memory:'先決定 Loop 與 Session 要由誰負責。'},

        {tab:'CLAUDE.md',k:'寫得短而明確',t:'它是 Project memory，不是百科全書',s:'只保留每次工作都需要知道的事。',kind:'stack',nodes:[['1','Project Context','這個 Repo 是什麼'],['2','Commands','如何 Build / Test'],['3','Rules','不可違反的工程慣例'],['4','Imports','詳細資料拆出去']],plain:'CLAUDE.md 沒有強制格式，但越精簡、越具體越容易遵循。實務上建議單檔約 200 行內，詳細內容用 @imports 或 .claude/rules 拆分。',points:['用標題與條列，方便人與 Claude 掃描。','相對 Import 路徑以來源檔案為基準。','Import 最多遞迴五層。'],example:'根目錄只寫架構、常用指令與不可違反規則；測試細節放 rules/testing.md。',code:'@.claude/rules/testing.md',trap:'把整份架構文件貼進 CLAUDE.md 會浪費 Context，也讓真正重要的規則被淹沒。',memory:'CLAUDE.md 要像值班小抄，不像圖書館。'},
        {tab:'Rules',k:'模組化指示',t:'Rules 讓規則在正確時機出現',s:'用 paths Frontmatter 把規則限制到特定檔案。',kind:'hub',nodes:[['Testing','tests/**'],['Security','auth/**'],['Rules','按路徑載入'],['Frontend','*.tsx'],['Database','migrations/**']],key:2,plain:'.claude/rules/ 適合存放主題化規範。帶 paths 的 Rule 只在讀取相符檔案時載入；沒有 paths 的 Rule 則在啟動時一律載入。',points:['Rules 適合 Monorepo 與多技術棧。','單一 Rule 只處理一個主題。','Rule 仍是 Contextual guidance，不是硬限制。'],example:'只在 *.tsx 套用 React component 規則，避免後端工作也載入。',code:'---\npaths: ["src/**/*.tsx"]\n---',trap:'無條件載入太多 Rules，效果與塞爆 CLAUDE.md 一樣。',memory:'讓規則跟著相關檔案出現。'},
        {tab:'Skills',k:'封裝流程',t:'Skill 是可重用的工作 Playbook',s:'SKILL.md 加 Frontmatter、指示與可測試 Scripts。',kind:'flow',nodes:[['/command','使用者呼叫'],['SKILL.md','指示・參數'],['Tools','受限執行'],['Result','固定格式']],key:1,plain:'新的 Custom slash commands 建議使用 .claude/skills/<name>/SKILL.md。Skill 可限制 allowed-tools、提供 argument-hint、使用 $ARGUMENTS，也能把確定性邏輯放進 Scripts。',points:['Skill 與 Legacy command 同名時，Skill 優先。','disable-model-invocation 可設成只由使用者啟動。','${CLAUDE_SKILL_DIR} 可穩定找到 Skill 資源。'],example:'建立 /validate-claude，執行固定 Script 檢查 Imports、Secrets 與 Frontmatter。',code:'.claude/skills/validate-claude/SKILL.md',trap:'!command 前處理會在 Claude 看到 Prompt 前執行 Shell，未驗證參數可能造成 Injection。',memory:'Skill 教流程；Script 做確定性工作。'},

      { number: 3, weight: '20%', title: 'Prompt Engineering & Structured Output', slides: [
        {tab:'Prompt 結構',k:'減少模糊',t:'好 Prompt 像清楚的工作單',s:'Task、Context、Examples、Output Contract 各自分區。',kind:'stack',nodes:[['1','Task','要做什麼'],['2','XML tags','分開不同區段'],['3','Examples','示範成功樣子'],['4','Output','固定格式']],plain:'Prompt engineering 的核心不是神奇關鍵字，而是降低歧義。明確說任務、提供必要 Context、用 XML tags 分區，再用 Examples 與 Schema 定義成功標準。',points:['System prompt 在 Messages API 是頂層 system。','避免把指示、資料與範例混成一段。','只提供完成任務所需資訊。'],example:'把 <instructions>、<examples>、<input> 分開，模型更容易知道哪些是規則。',code:'system="..."\nmessages=[{"role":"user","content":"<input>...</input>"}]',trap:'Messages API 沒有 role: "system" 的 messages 項目。',memory:'Prompt 越像規格書，輸出越可預期。'},
        {tab:'Few-shot',k:'用範例教',t:'少講抽象規則，多示範好答案',s:'Examples 能教格式、語氣與判斷邊界。',kind:'flow',nodes:[['Input','案例'],['Good Example','正確'],['Claude','歸納'],['Output','一致']],key:1,plain:'Few-shot prompting 是把少量代表性案例放進 Prompt。模型通常能從例子學到你難以用文字完整描述的格式、風格與分類規則。',points:['先放少量高品質、貼近真實資料的案例。','刻意涵蓋容易失敗的 Edge cases。','Bad example 必須清楚標成 Bad。'],example:'情緒分類同時提供正面、負面與模稜兩可案例。',code:'<example><input>...</input><output>...</output></example>',trap:'沒有固定的「永遠 3–5 個範例」規則；無關範例只會浪費 Context。',memory:'Example 是行為示範，不是裝飾。'},

      { number: 4, weight: '18%', title: 'Tool Design & MCP Integration', slides: [
        {tab:'三種 Tool',k:'執行位置',t:'不是所有 Tool 都在同一個地方跑',s:'Client、Anthropic Server、MCP Server 各自負責。',kind:'stack',nodes:[['1','Client tools','你的 App 執行'],['2','Server tools','Anthropic 執行'],['3','MCP tools','MCP Server 執行'],['4','Claude','選擇與組合']],plain:'Claude 只產生 Tool call；實際執行者依工具類型不同。Client Tool 由你的應用程式處理，Server Tool 在 Anthropic 基礎設施執行，MCP Tool 則由連線的 MCP Server 執行。',points:['權限與資料邊界取決於執行位置。','不同 Surface 可用的 Server tools 不完全相同。','所有外部結果都視為不受信任資料。'],example:'內部 DB Adapter 是 Client Tool；GitHub MCP 由 MCP Server 包裝。',code:'Claude chooses → executor runs → result returns',trap:'把 Tool 定義當成 Tool 已經被執行；定義只告訴 Claude如何呼叫。',memory:'Claude 決定動作；執行層負責真正動手。'},
        {tab:'Tool Contract',k:'呼叫契約',t:'name、description、input_schema 缺一不可',s:'Description 負責 Routing；Schema 負責參數邊界。',kind:'flow',nodes:[['Define','name・description'],['Choose','tool_choice'],['Call','tool_use'],['Return','tool_result']],key:1,plain:'好 Tool definition 讓 Claude 知道何時用、會得到什麼、什麼情況不要用。當 stop_reason 是 tool_use，執行後必須回傳對應的 tool_result。',points:['tool_choice 有 auto、any、tool、none。','並行 Tool calls 只在副作用安全時使用。','失敗要用 is_error: true。'],example:'lookup_invoice 描述應說「僅在使用者提供 Invoice ID 時使用」。',code:'tool_use{id,name,input} → tool_result{tool_use_id}',trap:'Tool description 寫成行銷文案，沒有說明使用時機，會降低 Routing 準確度。',memory:'Description 教「何時用」；Schema 限制「怎麼用」。'},
        {tab:'MCP Roles',k:'標準連接器',t:'MCP 是 Model Context Protocol',s:'Host 裡的 Client，透過 Server 接到外部系統。',kind:'flow',nodes:[['你','User'],['Claude Code','Host + Client'],['MCP Server','Protocol'],['外部系統','API・DB・SaaS']],key:2,plain:'MCP 是一個開放協定，讓 AI Host 用一致方式連接工具、資料與工作流程。Host 是使用者操作的 AI 應用；Client 是內部協定 Adapter；Server 暴露能力。',points:['MCP 不是 Managed control plane。','Server 可以是本機程序或遠端服務。','External system 是 Server 實際包裝的 API 或資料庫。'],example:'Claude Code 作為 Host，透過 Notion MCP Server 讀寫 Notion。',code:'User → Host → MCP client ↔ MCP server ↔ External system',trap:'把 Host、Client、Server 三種角色混為一談。',memory:'Host 接待使用者；Server 提供能力。'},

        {tab:'Transport',k:'如何連線',t:'雲端多用 HTTP；本機程序多用 stdio',s:'Project 共用設定放 .mcp.json。',kind:'split',nodes:[['HTTP / SSE','遠端服務'],['stdio','本機 Process']],plain:'Claude Code 支援 HTTP、SSE 與 stdio Transport。Project scope 的 MCP Server 可寫進 .mcp.json 並提交 Git；Local 與 User scope 通常存放個人設定。',points:['Project Server 第一次使用前會要求核准。','.mcp.json 可使用環境變數展開。','Remote MCP 要處理 Auth、Timeout 與憑證。'],example:'Notion SaaS 使用 HTTP；本機 DB helper 使用 stdio。',code:'claude mcp add --transport http|sse|stdio ...',trap:'把 Secret 直接寫進 .mcp.json；應使用 ${ENV_VAR}。',memory:'Transport 看位置；Scope 看誰要共用。'},

        {tab:'Security',k:'不信任邊界',t:'Strict 不是免驗證通行證',s:'輸入、輸出與遠端內容都要再次驗證。',kind:'shield',core:['Tool / MCP','受控能力'],nodes:[['Validate','Server side'],['Secrets','Credential store'],['Timeout','Retry policy'],['Audit','Latency・Error']],plain:'strict: true 只確保資料符合 Schema，不保證內容安全。Tool Server 仍要檢查授權、業務規則與 Prompt injection，並使用最小權限憑證。',points:['Transient failure 可 Retry；Malformed request 不要盲試。','遠端內容可能包含惡意指示。','記錄 Auth failure、Latency 與 Error rate。'],example:'即使 invoice_id 符合字串 Schema，也要確認使用者有權查看該 Invoice。',code:'schema valid ≠ authorized ≠ safe',trap:'把模型輸出或 MCP Resource 當成可信任指示，導致 Prompt injection。',memory:'Schema 驗格式；Server 驗權限與業務安全。'}

        {tab:'Retry',k:'錯誤分類',t:'不是每個失敗都該再試一次',s:'先分辨暫時性錯誤與請求本身的問題。',kind:'split',nodes:[['可以 Retry','429・529・5xx'],['不要盲試','400・401・403']],plain:'429 是 Rate limit，應遵守 retry-after 並降低並發；529 是服務 Overload；5xx 多半是暫時性問題。400、401、403 通常要修 Request、Auth 或 Policy。',points:['Retry 使用 Exponential backoff + jitter。','設定最大重試次數與 Deadline。','副作用 Tool Retry 前先查 Idempotency。'],example:'429 等 2 秒再試；401 應更新 Credential，不是連續打十次。',code:'transient → bounded retry | permanent → fix',trap:'把 429 與 529 當成同一原因，或對所有 4xx 無限 Retry。',memory:'暫時故障才重試；設定錯誤要修正。'},
