escriptions for routing, not marketing A good tool description answers: - When should Claude use this tool?","Context":"For multi-agent systems, Claude’s ecosystem offers both “classic” MAS organizations (master-worker, blackboard, broker, peer-to-peer) and Claude-specific primitives: subagents (context-isolated agent instances invoked via the Agent tool), plus cookbook-proven workflows like orchestrator-workers, evaluator-optimizer, and routing/parallelization.","ContextRot":"Operationally, long-lived agent systems must be designed around context as a finite, degrading resource (“context rot”), and should use server-side compaction, context editing (tool-result/thinking clearing), and prompt caching to keep cost/latency sustainable.","PromptCache":"Operationally, long-lived agent systems must be designed around context as a finite, degrading resource (“context rot”), and should use server-side compaction, context editing (tool-result/thinking clearing), and prompt caching to keep cost/latency sustainable.","Compaction":"Operationally, long-lived agent systems must be designed around context as a finite, degrading resource (“context rot”), and should use server-side compaction, context editing (tool-result/thinking clearing), and prompt caching to keep cost/latency sustainable.","ContextEditing":"Operationally, long-lived agent systems must be designed around context as a finite, degrading resource (“context rot”), and should use server-side compaction, context editing (tool-result/thinking clearing), and prompt caching to keep cost/latency sustainable.","Backoff":"Respect retry-after, back off with jitter, reduce concurrency.","Budget":"For loop correctness and reliability, treat Claude as a policy/decision engine that emits structured *actions* (tool calls) and *next-step intent*, while your application enforces budgets, stop conditions, tool idempotency, and safety constraints.","PermissionMode":"Claude Code surfaces expose permission modes such as default, acceptEdits, plan, dontAsk, auto, and bypassPermissions; SDK callbacks let you layer additional policy on top of those defaults.","HumanInLoop":"Human-in-the-loop patterns Route work to humans when: - the action has high external side effects - the model is about to touch production systems or sensitive data - the output remains ambiguous after retries or validation - policy requires approval regardless of model confidence Practical examples include PR review before merge, approval before deployment, or human validation of extracted records that drive financial or legal workflows.","Observability":"Scope, assumptions, and source strategy This report focuses only on: Designing agentic loops, multi-agent patterns, and session management for Claude’s platform surfaces (Messages API + Agent SDK), including: state persistence, scaling/fault-tolerance, security/privacy, and testing/observability as they relate to loops/sessions."};

    const TERM_LIBRARY = {
      Agent:{what:"能根據目標與環境回饋，反覆做出「判斷 → 行動 → 觀察」決策並主動使用 Tools 完成任務的系統，而不是只回一段文字就結束的聊天機器人。",why:"重點不在「有沒有 Tools」，而在於系統是否具備 Agentic 特性：能依照回饋不斷調整下一步。原文明確定義 Agent 要能「推進外部世界中的工作」——也就是要能讓某件事真的被完成（例如建立一張工單、修好一段程式），不是只產生建議文字。Claude 平台提供兩條路線達成這件事：Stateless 的 Messages API（你自己蓋 Loop 與 Session），或內建完整 Runtime 的 Agent SDK。",pitfall:"常見誤解是「Tools 越多才算 Agent」。實際上 Tools 應該只提供任務真正需要的能力，硬塞一堆用不到的 Tools 反而會讓 Claude 更難挑選正確工具、拖累 Routing 準確度。",example:"例如一個「處理退款申請」的 Agent：先判斷是否符合退款政策 → 呼叫查詢訂單 Tool → 依結果決定核准或轉人工 → 執行退款動作 → 回報結果，這整套反覆決策＋動作的流程就是 Agentic 行為，跟單純回答「退款政策是什麼」的問答完全不同。"},
      Orchestrator:{what:"位在「模型」與「Tools／外部世界」之間的控制層，負責管理 Loop 執行、狀態保存、預算、權限、重試（Retry）與停止條件，讓 Claude 的決策真正被安全地執行。",why:"Claude 本身只負責「決定要做什麼」（輸出 tool_use），但它不會自己執行工具、也不會自己記帳或設停損點；這些確定性（deterministic）的把關工作，全部要靠 Orchestrator 來做。原文建議把 Claude 當成「policy/decision engine」，由你的應用程式負責 enforce 預算、停止條件、工具冪等性（Idempotency）與安全限制。多 Agent 系統中，Orchestrator 也常扮演 Coordinator 的角色，把多個 Subagent 的結果彙整、送去 Synthesis。",pitfall:"不要以為 Claude 的回應本身就具備『安全煞車』——如果沒有 Orchestrator 層去實作 max_turns、budget 等硬限制，Loop 可能無限跑下去或重複執行有副作用的操作。",example:"在 Orchestrator-workers 模式中，Orchestrator 負責把使用者任務拆解成子任務、指派給不同 Subagent（研究員、工程師、審查員），等各自回報後再交給 Synthesis Agent 整合成最終答案，而不是讓每個 Subagent 各自直接回覆使用者。"},
      Loop:{what:"Agent 重複執行「思考（Think）→ 行動（Act）→ 觀察（Observe）→ 更新狀態（Update）」的控制流程，直到任務完成或觸發明確的停止條件為止。",why:"這是 Agentic 系統的核心骨架，對應學術上 ReAct 等「推理＋行動交錯」的做法。每一輪 Loop（Turn）就是 Claude 送出 tool_use、應用程式執行工具、把 tool_result 餵回去，再看 Claude 下一步要繼續呼叫工具還是結束回合。Agent SDK 把這整套 Loop 封裝成內建功能，並提供 max_turns、max_budget_usd 這類硬性上限；如果你自己在 Messages API 上蓋 Loop，就要自行在 Orchestrator 層複製這些控制機制。",pitfall:"常見錯誤是只設定「跑幾輪就停」，卻沒有定義「任務真的完成了」的判斷條件；也要避免在 tool_result 後面立刻加一段文字說明，官方文件指出這會讓 Claude 提早以 end_turn 結束、產生空白回應。",example:"一個除錯 Agent 的 Loop：讀取錯誤訊息（Observe）→ 判斷可能原因（Think）→ 呼叫「執行測試」Tool（Act）→ 根據測試結果更新假設（Update）→ 重複此循環，直到測試全數通過（停止條件：Goal achieved）或撞到 max_turns（停止條件：Budget exhausted）。"},
      stop_reason:{what:"Claude 回應中附帶的結構化停止訊號欄位，用來明確告訴你的程式「這次回合為什麼停下來」，而不是靠猜測文字內容判斷。",why:"這是 Loop 能否穩定運作的關鍵。`stop_reason: \"tool_use\"` 代表 Claude 要呼叫工具，你的程式必須執行對應動作並回傳 tool_result；`end_turn` 通常代表這回合真正結束；其他還有 `max_tokens`（輸出被截斷，若正好斷在 tool_use 區塊建議提高 max_tokens 重試）與 `pause_turn`（常見於 Server tools，需要把暫停的回應原樣送回去讓它繼續）。用結構化欄位判斷，比起「搜尋回應文字裡有沒有『我完成了』之類字眼」可靠得多，也更適合寫成自動化程式邏輯。",pitfall:"不要用關鍵字比對文字內容來判斷 Loop 該不該停，這是最常見也最脆弱的做法；正確方式一律是檢查 stop_reason 這個結構化欄位。",example:"考題情境：Agent Loop 收到 Claude 回應後，最可靠的判斷依據就是讀取 `response.stop_reason`——是 `tool_use` 就去執行工具，是 `end_turn` 才代表可以把答案交付給使用者。"},
      MessagesAPI:{what:"Claude 的無狀態（Stateless）核心 API。每一次呼叫都必須由你的應用程式重新附上完整（或篩選過）的對話歷史與工具結果，Claude 本身不會替你記住上一輪說過什麼。",why:"「Session」在 Messages API 底下是「應用層」的概念，不是平台自動幫你管理的東西——這是它與 Agent SDK 最本質的差異。這種設計的好處是彈性高：你可以自訂 Control plane、自訂跨主機的狀態儲存方式，天然具備可攜性（Portability），因為你自己的資料庫才是權威來源；代價是壓縮（Compaction）、快取（Prompt caching）、記憶（Memory）都要自己動手實作。",pitfall:"常見誤解是以為 Messages API 有某種內建的「對話記憶」——實際上完全沒有，若少送了關鍵歷史訊息，Claude 就真的「不記得」了。",example:"考題情境：Messages API 與 Agent SDK 的主要架構差異，正解是「Messages API 是 Stateless，Session 完全由你自己的應用程式維護」，而不是「Messages API 沒有 Tool use」（它其實支援 Tool use，只是狀態要你自己管）。"},
      AgentSDK:{what:"把 Claude Code 內部使用的「自主 Loop」封裝成可用的 SDK／函式庫，內建 Agent Loop、Tools、Permissions、Hooks、Subagents，以及會自動寫入磁碟的 Session 機制。",why:"如果你需要的是完整的 Agent Runtime（而不只是單純呼叫模型），Agent SDK 提供現成的生產級元件：`max_turns` / `max_budget_usd` 這類硬性上限、SystemMessage／AssistantMessage／ResultMessage 等結構化訊息型別方便你做監控與除錯、以及自動套用 Prompt caching 讓穩定的前綴（System prompt、Tool definitions、CLAUDE.md）重複利用降低成本。一個 Turn 代表一次「Claude 發出工具呼叫 → SDK 執行 → 結果餵回」的內部往返，Loop 會一直跑到 Claude 產出「沒有工具呼叫」的回應為止才算結束。",pitfall:"不要以為 Agent SDK 一定比 Messages API 「更適合 Production」——原文明確指出沒有單一答案：需要自訂 Control plane、跨主機狀態管理的系統仍適合用 Messages API 自建；需要完整 Agent Runtime（Session、Permissions、Subagents 都要）才是 Agent SDK 的強項。",example:"考題情境：同時設定 `max_turns` 與 `max_budget_usd`，先撞到回合上限時會怎樣？答案是 Agent SDK 會回傳帶有 `error_max_turns` 這類錯誤 subtype 的 ResultMessage，而不是靜默結束或繼續跑到預算也耗盡。"},
      tool_use:{what:"Claude 在回應中發出的「工具呼叫意圖」內容區塊，包含一個唯一的 `id`、要呼叫的 Tool 名稱 `name`，以及呼叫參數 `input` 物件。",why:"這是 Claude 與外部世界互動的第一步：Claude 本身不會真的執行任何動作，它只是「表達意圖」——決定要用哪個工具、帶什麼參數。你的應用程式收到 `stop_reason: \"tool_use\"` 後，必須真正執行這個工具呼叫，然後把結果透過 tool_result 送回去，Loop 才能繼續。Claude 也可能一次要求多個工具呼叫（除非你設定 `disable_parallel_tool_use=true` 強制序列化）。",pitfall:"每個 tool_use 區塊的 `id` 是獨一無二的，這個 id 之後必須原封不動地放進對應的 tool_result 的 `tool_use_id` 裡——用陣列順序去對應而不是用 id，在並行呼叫或重試情境下很容易配對錯誤。",example:"Claude 判斷需要查詢資料庫時，會回傳類似 `{\"type\":\"tool_use\", \"id\":\"toolu_x\", \"name\":\"search_db\", \"input\":{\"q\":\"...\"}}` 的區塊，你的程式看到後執行 `search_db` 這個函式，再把查詢結果包成 tool_result 送回去。"},
      tool_result:{what:"你的應用程式在執行完工具之後，回傳給 Claude 的結果內容區塊，必須透過 `tool_use_id` 精準對應到原本觸發這次呼叫的 tool_use 區塊。",why:"`tool_use_id` 是 Claude「意圖」與你「執行結果」之間穩定的 Join key，這個設計讓系統可以支援並行呼叫（多個工具同時執行、結果各自配對回去）、重試（Retry 時可以用同一個 id 判斷是否已經執行過）、稽核（Audit）與重播（Replay）測試。若工具執行失敗，應該回傳 `is_error: true` 加上結構化的錯誤內容，而不是回傳空字串或靜默跳過——明確的錯誤訊息能讓 Claude 判斷該重試、改用其他方式，還是向使用者說明狀況。",pitfall:"絕對不要只靠陣列順序（第幾個 tool_use 對應第幾個 tool_result）去配對——多工具並行呼叫時順序可能對不上，正確做法永遠是用 `tool_use_id` 明確配對。另外也不建議在同一則使用者訊息中，於 tool_result 後面緊接著加一段額外文字，這是官方文件記載會觸發提早結束（空白 end_turn）的已知陷阱。",example:"考題情境：Tool 執行失敗時最正確的回傳方式，是帶上 `is_error: true` 與結構化錯誤內容，讓 Agent Loop 能夠恢復並繼續判斷，而不是回傳空的 tool_result 或固定重試三次後就放棄不說明。"},
      Subagent:{what:"由 Parent Agent 透過 Agent 工具委派出去的獨立 Agent 執行個體，擁有自己「乾淨」的 Context（不會自動繼承 Parent 的完整對話歷史），通常只把最終結果訊息交回給 Parent。",why:"這是 Context isolation 的具體實作：Subagent 執行過程中產生的大量中間 Tool 呼叫與結果，全部留在 Subagent 自己的 Context 裡，不會污染或撐大 Parent 的 Context——這正是控制 Context 成長、避免主線對話被大量瑣碎細節塞爆的關鍵手法。Subagent 可以設定專屬的角色 Prompt、限定可用的 Tools、指定不同的模型，甚至透過 `.claude/agents/` 用檔案定義。因為 Subagent 收到的只有 Parent 交付的那段 Prompt 字串，所以任務描述裡務必寫清楚必要的限制條件與期望的輸出格式。",pitfall:"不要以為 Subagent 會自動知道 Parent 之前討論過什麼——它不會，只有 Parent 明確寫進委派 Prompt 裡的內容才看得到。另外，Subagent 預設不應該再擁有 `Agent` 這個工具，否則可能遞迴地一直產生新的 Subagent，最安全的做法是把 `Agent` 從 Subagent 的工具清單中拿掉。",example:"研究任務中，Parent 把「幫我查清楚 A 公司過去三年財報重點」交給一個研究型 Subagent，這個 Subagent 自己反覆搜尋、讀取、篩選資料（產生大量中間過程），但最後只把一份精簡摘要回傳給 Parent，Parent 的 Context 完全不會被搜尋過程中的雜訊塞滿。"},
      Parallelization:{what:"把彼此互不依賴的工作任務同時分派給多個 Agent／Subagent 並行執行，藉此縮短整體等待時間（Latency），但相對地會提高並發量與整體成本。",why:"當任務可以拆成互不依賴的子任務時（例如同時研究三個不同主題），平行處理能大幅縮短總耗時，這也是官方 Cookbook 認可的基礎多 Agent 工作流程之一。但「Agent 數量越多不代表答案越好」——如果分工彼此重疊、沒有人負責整合、或共享狀態管理混亂，只會白白增加 Token 消耗、拖長 Latency，甚至讓不同 Agent 產出互相矛盾的結論。",pitfall:"平行執行完成後，不應該讓各個 Subagent 各自直接回覆使用者，也不該讓它們私下彼此合併結果——正確做法是由 Coordinator／Orchestrator 保持中央可見性，統一交給一個 Synthesis Agent 做最終整合，確保結論一致。",example:"考題情境：研究與文件分析兩個 Subagent 都完成後，下一步最適合的做法是「Coordinator 把兩者結果交給 Synthesis Agent 整合」，而不是讓兩個 Subagent 直接把各自的 Raw output 拼在一起回給使用者。"},
      Session:{what:"可以延續、可以回顧的對話歷史與工具互動紀錄的集合，但它記錄的是「對話發生了什麼」，並不等同於檔案系統（Filesystem）真正被改了什麼。",why:"Agent SDK 明確把「對話歷史」與「檔案系統狀態」拆成兩件事：Session 會被自動持久化寫到磁碟（`~/.claude/projects/<encoded-cwd>/*.jsonl`），支援 Continue（接續最近一次的 Session）、Resume（用特定 ID 恢復）、Fork（複製歷史後另闢分支）三種操作；但如果你想要「回到某個時間點的檔案狀態」，必須另外用 Git branch、Checkpoint 或其他檔案系統機制處理，Session 本身不會幫你做這件事。跨主機恢復 Session 時，需要把 Session 檔案複製到相同路徑、並確保 `cwd` 一致，否則可能恢復失敗。",pitfall:"最容易搞混的地方：Fork 一個 Session 只會複製「對話歷史」，不會一併複製當時的檔案狀態；以為 Fork 完檔案也會跟著分支，是常見的誤解。",example:"考題情境：Continue、Resume、Fork 的正確差異——Continue 是自動找最近的 Session，Resume 是用指定 ID 恢復，Fork 是複製歷史後另外分支，但 Fork 並不會自動連帶分支 Filesystem 的變更。"},
      Idempotency:{what:"同一個操作即使被重複執行多次，也只會產生一次有效副作用的特性；在 Claude 系統裡通常透過記錄 `tool_use.id` 或專屬的 idempotency key 來做去重（Deduplication）。",why:"工具呼叫常常帶有真實副作用（寫入資料庫、建立工單、扣款等），而 Retry 或 Replay 是 Agent 系統中很常見的情境——網路逾時、Loop 重跑、測試重播都可能導致同一個工具呼叫被送出不只一次。如果工具沒有冪等性設計，重試就可能造成重複扣款或建立重複資料。做法是記錄每個 `tool_use.id` 對應的執行結果，重試時直接「Replay」已儲存的結果，而不是真的再執行一次有副作用的操作。這也呼應更廣義的安全觀念：光是 Schema 驗證通過，不代表可以直接執行高風險工具，還需要一併檢查授權、業務規則、預算與是否需要人工核准。",pitfall:"不要以為「Schema 驗證過關」就等於「這個操作安全可以執行」——Schema 只保證格式正確，完全不保證這個操作在業務邏輯上是合理、被授權、或不會重複執行的。",example:"考題情境：為什麼有副作用的 Tool 必須支援 Idempotency？正解是「Retry 或 Replay 不應該重複執行已完成的操作」——例如付款 Tool 若沒有冪等性保護，網路逾時後的自動重試可能導致使用者被扣款兩次。"},
      CLAUDEmd:{what:"Claude Code 在每次 Session 開始時自動讀取的 Markdown「專案記憶」檔案，用來提供持久化的專案背景、指令慣例與工作規範，讓 Claude 不用每次都重新「認識」這個專案。",why:"Claude Code 每次啟動都是全新的 Context window，CLAUDE.md 就是解決這個問題的核心機制。它沒有強制格式（No required format），但官方建議精簡、結構化、具體，單一檔案盡量控制在 200 行左右，太長就拆成 `.claude/rules/` 或用 `@import` 引用其他檔案。最重要的一點：CLAUDE.md 屬於「軟性指引」（Contextual guidance），它會影響 Claude 的行為，但不是保證一定會被遵守的強制機制——這正是它與 Settings 的本質差異。",pitfall:"最常見的考試陷阱：以為 CLAUDE.md 和 Settings 可以互換使用來做安全管控。CLAUDE.md 只能「引導」行為，真正需要強制執行的安全邊界（例如禁止某些操作）必須放在 Settings、Hooks 或 Sandbox 這類確定性的強制層。",example:"考題情境：CLAUDE.md 與 settings.json 的主要差異是什麼？正解是「CLAUDE.md 是軟性 Context；Settings 是 Client 端強制規則」——這是全考科反覆出現的核心觀念，行為指引與確定性強制必須分開設計。"},
      Settings:{what:"Claude Code 的階層式設定檔（`settings.json`），由 Client 端強制執行，用來管理 Permissions、Hooks、環境變數與工具行為，是真正具有強制力的設定層。",why:"Settings 分成 User（`~/.claude/settings.json`）、Project（`.claude/settings.json`）、Local（`.claude/settings.local.json`，個人在單一 repo 的覆寫）與 Managed（企業層級、不可被使用者繞過的政策）四種範圍。實務上常見的分工模式是：團隊共用的 Permissions、Hooks、Plugins、MCP servers 放進 Project settings；個人化或實驗性的覆寫放進 `settings.local.json`；不可被覆寫的企業政策則保留給 Managed settings。這一整套設計，正是用來補上 CLAUDE.md「只能引導、不能強制」的缺口。",pitfall:"不要把 Settings 想成跟 CLAUDE.md 功能相同只是格式不同——兩者定位完全不一樣：一個是行為指引，一個是強制規則，考試常直接測這個對比。",example:"一個團隊希望所有成員都不能執行危險的 Bash 指令，正確做法是在 Project 或 Managed settings 中設定 Permission 規則去擋下，而不是寄望在 CLAUDE.md 裡寫一句「請不要執行危險指令」就能保證被遵守。"},
      Hierarchy:{what:"CLAUDE.md 與相關設定檔的載入範圍層級：Managed（企業全公司）→ User（個人偏好）→ Project（團隊規範）→ Subdirectory（局部子目錄需求），原則是「越具體的內容，越貼近當前工作，優先權越高」。",why:"Claude Code 會沿著目錄樹往上找 CLAUDE.md（例如在 `foo/bar/` 底下執行，會同時載入 `foo/bar/CLAUDE.md` 與 `foo/CLAUDE.md`），這套階層設計讓企業政策、個人偏好、團隊規範與局部子目錄需求可以並存又不互相干擾，同時保有「更具體的規則覆蓋更廣泛的規則」這個一致原則。",pitfall:"容易誤以為階層之間是「疊加相加」而非「具體優先」——正確理解是越靠近實際工作路徑、範圍越窄的設定，通常代表越貼近當下情境的規則。",example:"企業層級的 Managed CLAUDE.md 規定所有專案都要遵守的資安基準，Project 層級的 CLAUDE.md 補充這個 repo 特有的建置指令，Subdirectory 層級的 CLAUDE.md 則只在你實際進到 `packages/frontend/` 工作時才會補充該套件特有的規範。"},
      LazyLoad:{what:"內容不會在 Session 啟動時就全部載入，而是等到真正需要時才進入 Context——具體來說，子目錄裡的 CLAUDE.md 會在 Claude 讀取該目錄下的檔案時才被載入（Lazy-loaded）。",why:"這個機制對大型 Monorepo 特別重要：如果啟動時就把所有子目錄的 CLAUDE.md 全部塞進 Context，不僅浪費大量 Token 額度，不同套件、不同團隊的規則之間還可能互相矛盾、彼此干擾。Lazy loading 讓「package/service 專屬的 CLAUDE.md 只在你實際在那個範圍工作時才出現」，Context 因此能保持精簡、規則之間也不會無謂衝突。",pitfall:"不要以為只要 CLAUDE.md 檔案存在於某個子目錄，內容就已經生效——在你真正讀取該目錄下的檔案之前，那份子目錄 CLAUDE.md 根本還沒進入 Context。",example:"考題情境：Monorepo 子目錄中的 CLAUDE.md 何時載入？正解是「讀取該子目錄檔案時 Lazy-load」，而不是啟動時全部載入，也不是只有透過 `@import` 才會載入。"},
      Import:{what:"CLAUDE.md 中使用 `@path/to/import` 語法引用其他檔案的機制，被引用的檔案內容會展開並載入 Context，最多可以遞迴（Recursive）引用到五層。",why:"當單一 CLAUDE.md 內容太多時，Import 讓你可以把細節拆分到獨立檔案再引用回來，保持主檔案精簡易讀。相對路徑是相對於「被引用檔案自身的位置」解析，而不是相對於當下的工作目錄。也支援引用外部／個人檔案（例如 `@~/.claude/my-project-instructions.md`），Claude Code 第一次遇到外部引用時會跳出核准對話框，拒絕後就不會再重複詢問。五層遞迴上限的設計，是為了避免無限循環引用、同時控制載入複雜度。",pitfall:"遞迴層數不是「無限」，也不是隨便一個數字——官方明確限制最多五層（five recursive hops），這是常考的精確數字，容易被「無限」或「三層」這類干擾選項混淆。",example:"考題情境：CLAUDE.md 的 `@import` 最多支援幾層遞迴？正解是 5 層，用意是避免無限引用鏈並控制載入複雜度，而不是像很多人直覺以為的「1 層」或「無限」。"},
      Rules:{what:"放在 `.claude/rules/` 目錄底下的模組化指示檔案，可以依主題拆分（例如 `testing.md`、`security.md`），並可透過 YAML Frontmatter 中的 `paths` 欄位，用 Glob pattern 限定只在符合特定路徑時才套用。",why:"這是官方針對「大型專案該如何擴充 CLAUDE.md」給出的建議做法：與其把所有規則塞進一個巨大檔案，不如拆成主題明確、各自聚焦的 Rules 檔案。沒有設定 `paths` 的 Rule，會在 Session 啟動時無條件載入（優先權與根目錄 `.claude/CLAUDE.md` 相同）；有設定 `paths` 的 Rule 則是路徑範圍（Path-scoped）載入，只有在處理符合路徑的檔案時才會進入 Context——這一點的行為其實跟子目錄 CLAUDE.md 的 Lazy loading 概念類似，但機制與設定方式不同。",pitfall:"不要把「沒有 paths 的 Rule」誤認為也是等到需要時才載入——它其實跟一般根目錄 CLAUDE.md 一樣，是 Session 一開始就無條件載入的，只有明確設定了 `paths` 的 Rule 才具備範圍限定的行為。",example:"一個 repo 底下有 `.claude/rules/security.md` 設定 `paths: [\"src/auth/**\"]`，這份安全規範只會在 Claude 處理 `src/auth/` 底下的檔案時才進入 Context，處理其他無關模組的程式碼時完全不會載入，藉此避免無關指示占用 Context。"},
      Skill:{what:"以 `SKILL.md` 封裝、可重複使用的工作流程包，包含 YAML Frontmatter（描述、參數提示、可用工具限制等）與 Markdown 指示內容，可以額外搭配 Scripts 等支援檔案；這也是目前官方建議取代舊版「自訂 Slash 指令」的標準做法。",why:"Skill 可以放在專案層（`.claude/skills/<name>/SKILL.md`）或個人層（`~/.claude/skills/<name>/SKILL.md`），能透過 `/skill-name` 手動呼叫，也能設定成模型可自動呼叫或僅限使用者手動呼叫（`disable-model-invocation`）。它還支援用 `!`command`` 前處理語法，在 Claude 看到 Prompt 之前先執行 Shell 指令、把輸出動態注入 Prompt 內容（例如注入目前的 git diff）。舊版 `.claude/commands/*.md` 依然可以運作，但如果 Skill 與 Legacy command 同名，Skill 優先。",pitfall:"`!`command`` 前處理是把雙面刃：它讓 Skill 能注入即時的動態內容，但這段指令是在 Claude 看到 Prompt「之前」就先執行的，如果參數沒有經過安全處理（Escape／驗證），就可能造成 Shell injection——這是 Domain 2 的高頻考點。",example:"考題情境：Skill 中的 `!`command`` 前處理主要風險是什麼？正解是「未安全處理參數可能造成 Shell injection」，因為這段前處理指令發生在 Claude 讀到 Prompt 之前，必須靠確定性的 Script 做驗證與跳脫字元處理，而不是靠模型自己判斷安不安全。"},
      allowed_tools:{what:"Skill Frontmatter 中用來限定「這個 Skill 執行期間可以使用哪些 Tools」的設定欄位，讓 Skill 在啟用時能取得額外工具權限、而不需要每次都跳出核准提示。",why:"這是 Skill 安全設計的重要一環：`allowed-tools` 只在該 Skill 被啟用、執行的當下生效，Skill 結束後仍然回到基準的 Permission 規則。設計上應該遵循最小權限原則（Least privilege）——只給任務真正需要的工具範圍，避免用過於寬鬆的授權（例如整個 `Bash(*)`）讓誤用或注入攻擊的影響範圍被不必要地放大。",pitfall:"在被廣泛呼叫、甚至可被模型自動呼叫的 Skill 上，授予過寬的 `allowed-tools`（例如完整的 Bash 存取權）是常見的安全隱憂；應該用精確的工具樣式（narrow tool patterns），並搭配「拒絕優先」（deny → ask → allow）的權限設計思維。",example:"一個「產生 Commit 訊息」的 Skill，`allowed-tools` 應該只開放 `Bash(git diff)`、`Bash(git log)` 這類唯讀且範圍精確的指令，而不是直接授權整個 `Bash(*)`，否則萬一 Prompt 被注入惡意內容，攻擊者能利用的工具範圍就會被不必要地放大。"},
      Hook:{what:"在 Tool 呼叫或 Session 生命週期事件「前後」執行的確定性攔截點，可以用來阻擋危險操作、稽核紀錄、正規化資料格式，是比 CLAUDE.md 更強制、比 Sandbox 更細緻的控制手段。",why:"Hook 是把「軟性引導」轉成「確定性強制」的關鍵機制：不像 CLAUDE.md 只能建議 Claude 怎麼做，Hook 是程式碼層級的攔截，可以真正擋下不該執行的工具呼叫、或是統一處理格式不一致的問題（例如把多個 MCP Tool 回傳的日期格式統一轉換）。這也是為什麼同時需要 Permissions 與 Sandbox 的原因：Permissions 決定「哪些 Tools 可以被呼叫」，Sandbox 進一步限制「Bash 子程序實際能碰到的檔案與網路範圍」，而 Hook 則是在這些呼叫發生的當下做精細的攔截與處理。",pitfall:"不要把 Hook 和 Permissions 混為一談——Permissions 決定「能不能用某個 Tool」，Hook 則是在 Tool 呼叫「發生的當下」插入確定性的檢查或轉換邏輯，兩者搭配使用才是完整的防禦層次（Defense in depth）。",example:"考題情境：多個 MCP Tools 回傳日期與狀態格式不一致，最可維護的正規化位置是「使用 PostToolUse Hook 統一轉換」，因為 Hook 是集中、確定且可測試的攔截點，也能處理你根本無法修改原始碼的第三方 MCP 輸出格式。"},
      Sandbox:{what:"作業系統層級的檔案系統（Filesystem）與網路（Network）邊界機制，用來限制 Bash 子程序實際能夠碰觸到的檔案範圍與對外連線能力（macOS 用 Seatbelt、Linux/WSL2 用 bubblewrap）。",why:"Sandbox 被定位為 Permissions 的補充，而非替代品：Permissions 決定「哪些 Tools 可以被呼叫」，屬於邏輯層級的授權；Sandbox 則是在 Bash 子程序真正執行時，於作業系統層級圈出一個實體邊界，即使某個操作被允許執行，它能碰到的檔案與網路範圍依然受到限制。這種雙層防護（Defense in depth）能同時降低誤用與惡意注入造成的損害範圍，也能透過 Proxy 做網域限制，在維持防護力的同時減少不必要的核准疲勞（Approval fatigue）。",pitfall:"不要以為只要設好 Permissions 就等於安全了——Permissions 管的是「要不要允許呼叫」，並不會限制被允許執行的操作實際能碰到多廣的檔案或網路範圍，這正是 Sandbox 存在的意義。",example:"即使某個 Bash 指令通過了 Permission 核准，Sandbox 仍然可以確保這個子程序只能存取專案目錄內的檔案、無法任意連到外部網路，就算指令本身有問題，實際造成的損害範圍也被限制住了。"},
      CICD:{what:"透過自動化 Pipeline 驗證、審查、版本化並部署 Claude 的設定檔（CLAUDE.md／Rules／Skills／Settings）及自動化工作流程，把「設定」當成 Policy-as-code 一樣嚴謹管理。",why:"官方文件把這件事拆成三個實際目標：驗證（Validation，例如檢查 import 是否失效、有沒有意外洩漏的機密字串）、自動化（Automation，在 CI 裡跑 Claude Code 做審查、產生 PR、自動處理 Issue）、部署（Deployment，用 MDM、Group Policy、Ansible 等企業配置管理工具分發 Managed 設定）。目前官方整合以 GitHub Actions（`anthropics/claude-code-action@v1`，由 Anthropic 官方維護）最完整；GitLab CI/CD 則標示為 Beta，由 GitLab 自行維護；Jenkins 與 CircleCI 沒有官方外掛，需要自行用 CLI/SDK 模式串接。安全上建議搭配最小權限、機密隔離（Masked variables／OIDC）、以及 `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1` 這類環境變數清除機制。",pitfall:"考試常見混淆點：不要把「GitHub Actions 官方維護」與「GitLab CI/CD 為第三方 Beta 維護」搞反——這是明確白紙黑字的差異，且經常被拿來出題。",example:"考題情境：哪個官方 Claude Code CI/CD 整合目前標示為 Beta、並由第三方維護？正解是 GitLab CI/CD（由 GitLab 自己維護、狀態為 Beta），而 GitHub Actions 則是由 Anthropic 官方維護的正式整合。"},
      SystemPrompt:{what:"Messages API 中用來提供跨整個請求之行為與角色指示的頂層 `system` 參數，這是獨立於 `messages[]` 陣列之外的欄位。",why:"這是 Domain 3 最容易踩雷的 API 形狀（Shape）題：正確寫法是把指示放進頂層的 `system` 參數，而不是像早期一些範例那樣，在 `messages` 陣列裡塞一則 `role: \"system\"` 的訊息——後者是過時、不正確的寫法。API 會結合你的 Tool definitions、Tool config 與你自己的 System prompt，一起組成完整的「Tool-use system prompt」；許多無效的工具呼叫問題，其實是靠改善描述與 Schema 範例修正的，而不是單純重試就能解決。",pitfall:"把 System prompt 寫成 `messages` 陣列裡的一則 `role: \"system\"` 訊息，是最經典的過時／錯誤示範，這在目前的 Messages API 裡是不成立的。",example:"考題情境：Messages API 的 System prompt 應放在哪裡？正解是「頂層 system 參數」，而不是 messages 內的 system role、也不是 output_config.system 或塞進第一則 User message。"},
      FewShot:{what:"在 Prompt 內放入少量具有代表性的 Input／Output 範例，直接示範期望的格式、語氣與判斷邏輯，讓模型「照著範例學」，而不是只靠文字描述規則。",why:"官方建議用 XML 標籤把 `<instructions>`、`<examples>`、`<input>` 清楚分隔，讓模型容易辨識每個區段的用途。範例的品質比數量更重要：沒有「3-5 個範例就是最佳解」這種放諸四海皆準的定律，重點是範例要盡量貼近真實任務、刻意涵蓋邊界情況（Edge cases），而不是寄望模型自己類推出來。也可以使用「反例」（負面範例）教模型什麼是不該做的，但務必用明確標籤區分好壞（例如 `<good>` / `<bad>`），一旦模型分不清某個範例是正面還是負面示範，效果通常會變差而不是變好。Few-shot 解決的是「格式、政策、風格」層面的問題；如果模型格式正確但推理深度不夠，該調整的是 Adaptive thinking 的 effort，而不是加更多範例。",pitfall:"誤區一：以為範例越多越好——應該優先加入「最能修正實際觀察到的失敗模式」的代表性範例，無關案例只會浪費 Context 額度。誤區二：混淆 Few-shot 與 Adaptive thinking 的用途——前者管格式與政策遵循，後者管推理深度，兩者是不同的槓桿，不能互相取代。",example:"考題情境：工具選擇只在模糊情境出錯時，最有效的 Few-shot 策略是「針對模糊案例加入少量含理由的比較範例」——精準對準實際的錯誤模式，並示範為什麼該選某個 Tool 而不是外觀相似的另一個 Tool，而不是盲目加入大量簡單案例或只是提高 max_tokens。"},
      JSONOutputs:{what:"透過 `output_config.format` 搭配 JSON Schema，約束 Claude「最終文字回答」必須符合指定結構的功能——控制的是 Claude 直接說出來的答案內容。",why:"這是 Anthropic 針對結構化輸出提供的兩個相關功能之一（另一個是 Strict tool use），兩者解決不同問題：JSON outputs 管的是 Claude 的「Final text」，Strict tool use 管的是「Tool call arguments」，可以同時使用、也可以只用其中一種。技術上它使用「Grammar-constrained decoding」，因此第一次針對新 Schema 送出請求時可能較慢（要先編譯 Grammar），但編譯完成的 Grammar 會被快取，後續同一份 Schema 的請求延遲會改善。即使有 Schema，仍然要驗證 `stop_reason`——如果是 Refusal（拒答）或 `max_tokens` 截斷，回傳內容仍然可能不符合 Schema 格式。",pitfall:"JSON outputs 不等於 Tool use，也不是「有 Schema 就萬無一失」——Refusal 與 max_tokens 截斷這兩種情況下，輸出還是有可能不符合 Schema，程式端仍要做驗證。另外 JSON outputs 與 Citations、Message prefilling 不相容，這也是常見考點。",example:"考題情境：目前 Messages API 設定 JSON structured output 的正確方式是什麼？正解是「output_config.format 使用 json_schema」，而不是舊式的 `response_format:\"json\"`、也不是只在 Prompt 裡寫「請回 JSON」這種沒有結構保證的做法。"},
      StrictTool:{what:"在 Tool definition 中設定 `strict: true`，強制 Claude 產生的工具呼叫（Tool name 與 arguments）必須完全符合你宣告的 Schema，這是在你的應用邏輯高度依賴「工具參數必須可靠」時該用的機制。",why:"Strict tool use 與 JSON outputs 控制的是不同的輸出通道：前者管 Tool call 的參數是否精確符合 Schema，後者管 Claude 最終回答文字的格式，兩者可以同時使用互不衝突。但要注意 `strict: true` 只保證「Schema conformance」（格式正確），並不保證使用者有權限執行這個操作，也不會檢查輸入內容是否含有惡意或不合理的意圖——這是「Schema valid」「Authorized」「Safe」三個彼此獨立的判斷面向，缺一不可。",pitfall:"常見誤解是以為 `strict: true` 開啟後，Server 端就不需要再驗證 Tool input 了——實際上仍然要做，這是「Defense in depth」的概念：Schema 合法、被授權、內容安全是三件不同的事，`strict:true` 只解決第一件。同時 `strict:true` 也不會驗證 tool_result（工具執行後回傳的結果），那部分責任在執行端自己。",example:"考題情境：strict:true 開啟後，為何 Server 仍要驗證 Tool input？正解是「為了 Defense in depth、授權與業務規則」——不能因為參數格式合法，就假設 Claude 的輸入永遠可信、或這個操作一定被允許執行。"},
      Schema:{what:"機器可驗證的資料結構契約，明確定義欄位型別、必填項目（required）、列舉值（enum）與是否允許額外欄位（additionalProperties），是 JSON outputs 與 Strict tool use 共同依賴的底層機制。",why:"設計原則上，Schema 應該盡量簡單、貼合任務本身：優先用扁平、欄位命名清楚的物件，而不是層層嵌套的複雜結構；固定分類用 `enum`；想嚴格限制物件範圍就設 `additionalProperties: false`；如果來源資料可能沒有某個欄位，就把它設成 Optional，而不是硬塞空字串之類的無效佔位符（除非 Schema 明確允許 null 或空字串）。另外要注意，Schema 中必填欄位與選填欄位在輸出中的順序是「可預期但非任意」的——必填欄位會先出現，接著才是選填欄位，各自保留原本在 Schema 裡的宣告順序。過於複雜的 Schema 可能導致編譯失敗或觸發重試，SDK 端的 Pydantic／Zod 之類 Helper 也可能會在傳給模型前，剝除或轉換一些不支援的 JSON Schema 限制條件（但 SDK 仍會用原始 Schema 在客戶端做驗證）。",pitfall:"不要用空字串或其他無效佔位符去代表「這個欄位沒有資料」，除非 Schema 明確允許——正確做法是把該欄位設計成 Optional 或允許 null。",example:"一份聯絡人擷取 Schema 若要求 `phone` 欄位在明確出現時使用「(555) 555-5555」格式，但來源訊息中根本沒有提到電話號碼，正確做法是讓 `phone` 是 Optional 欄位並在此次結果中省略它，而不是硬塞一個空字串進去。"},
      Extraction:{what:"從來源內容中取出結構化欄位的整體流程；核心原則是「格式穩定就優先用確定性的 Parser 處理，需要語意理解與正規化時才交給 Claude」，而不是遇到任何資料都無腦丟給模型。",why:"官方建議的判斷順序：先問「來源是否穩定到可以用一般 Parser 解析」（例如已經是結構化的 JSON、XML、CSV），如果不是，才向 Claude 要求帶 Schema 的結構化輸出；接著在應用程式碼中驗證結果、正規化型別與單位格式，最後把低信心或模糊的案例記錄下來、轉交人工複核。方法選擇表也很明確：Regex 適合穩定的字串樣式（ID、Email、日期）但對雜亂文字很脆弱；原生 Parser 適合本來就結構化的來源；NER／傳統 NLP 適合實體密集的文字但領域細節掌握有限；Claude + Schema 則適合雜亂文件、需要語意理解與正規化的情境，靈活但需要 Prompt 與 Schema 的紀律。",pitfall:"常見誤區是「一律用 Claude 做擷取」——如果來源本來就已經是穩定的 JSON、XML、CSV 或固定字串樣式，用 Native parser 或 Regex 通常更快、更便宜，結果也更可預期，沒有必要交給模型處理。",example:"考題情境：資料擷取時應如何選擇 Parser 與 Claude？正解是「穩定結構用 Parser；需要語意理解才用 Claude」——Production 管線的正確設計是讓 Deterministic code 處理確定的部分，Claude 補上語意判斷的空缺，最後仍要在程式端做驗證。"},
      AdaptiveThinking:{what:"Claude Opus 4.6 與 Sonnet 4.6 建議採用的推理設定方式，透過 `effort` 參數控制模型的推理深度、成本與延遲，取代舊式手動設定 `thinking` 物件（或錯誤寫法 `thinking=true`）的做法。",why:"這是又一個常見的「過時 API 用法」陷阱：`thinking=true` 是不正確且過時的寫法，正確心智模型是 Adaptive thinking 搭配 `effort` 參數（舊式手動的 `thinking: {\"type\": \"enabled\", \"budget_tokens\": N}` 仍相容但正逐漸被淘汰）。使用時機的判斷邏輯：如果問題是「格式錯誤」或「沒有遵循既定政策／規則」，該修正的是 Few-shot 範例、Schema 或指示內容，而不是拉高 effort；只有當問題確實是「推理深度不足、難題想不透」時，提高 effort 才有效——這也呼應 Few-shot 與 Adaptive thinking 是兩種不同槓桿的核心觀念。",pitfall:"拉高 effort 並不能修好「欄位名稱寫錯」這類格式或政策遵循問題——這類問題的根因通常在 Examples、Schema 或 Instructions 不夠清楚，而不是模型想得不夠深入，提高 effort 對症下藥的對象完全不同。",example:"考題情境：Claude Opus 4.6 與 Sonnet 4.6 建議的推理設定是什麼？正解是「Adaptive thinking 搭配 effort」，`thinking=true` 是過時且不正確的寫法，單純寫「think step by step」這種 Prompt 技巧也不等於正式的推理控制機制。"},
      ClientTool:{what:"由你自己的應用程式（Application）負責執行的工具，例如內部 API Adapter、資料庫查詢函式；Claude 只負責發出呼叫意圖，實際執行的程式碼跑在你的伺服器上。",why:"這是三種工具類型之一（Client tools / Anthropic server tools / MCP tools）的判斷依據，關鍵在於「執行位置」：跑在你的應用程式裡的就是 Client tool；跑在 Anthropic 基礎設施上的是 Server tool（例如 `web_search`、`code_execution`）；由 MCP Server 執行的則是 MCP tool。就算是透過 MCP 連上的能力，只要「實際執行」是發生在你或第三方架設的 MCP Server 上，也不該與 Anthropic Server tools 混為一談。",pitfall:"不要單憑「這個 Tool 是不是我自己定義的」來判斷類型——真正的判斷依據永遠是「誰執行它」，內部資料庫 Adapter 即使定義在你的程式碼裡，本質上仍然是由你的 Application 執行，所以是 Client tool。",example:"考題情境：內部資料庫 Adapter 由你的 Application 執行，屬於哪一類 Tool？正解是 Client Tool——因為執行位置在你的 Application，而不是 Anthropic Server Tool、MCP Prompt 或 MCP Resource。"},
      ServerTool:{what:"由 Anthropic 基礎設施直接執行的工具，例如 `web_search`、`code_execution`、`web_fetch`、`tool_search`（實際可用項目依模型與使用介面而異），執行過程不經過你自己的伺服器。",why:"Server tool 的特殊之處在於回應可能出現 `pause_turn` 這個 stop_reason——這通常發生在 Server tools 執行過程中，你的處理方式應該是把這個「暫停狀態」的回應原封不動地送回去，讓 Claude 的流程可以繼續，而不是自行改寫或省略這段內容。這與 Client tool、MCP tool 最大的差別在於：Anthropic 直接掌控執行環境，你不需要自己架設任何執行基礎設施。",pitfall:"遇到 `pause_turn` 時，不要誤以為這是錯誤或需要重新發起請求——正確處理方式是把暫停的回應原樣傳回去繼續這個回合。",example:"當 Claude 使用 `web_search` 這類 Anthropic Server tool 進行多步驟搜尋時，可能會收到帶有 `pause_turn` 的中繼回應，你的程式應該把這個回應原樣送回去，讓 Claude 能接續完成搜尋與後續推理，而不是把它當成一般的終止狀態處理。"},
      MCP:{what:"Model Context Protocol 的縮寫——一個開放協定，讓 AI 應用程式（例如 Claude Code）能以標準化的方式連接外部工具、資料來源與工作流程，不受限於單一廠商實作。",why:"這是本領域最直接的名詞定義題，也是最常見的誤解陷阱：MCP 不是「Managed Control Plane」，而是「Model Context Protocol」。它是開放協定，任何實作 Host、Client 與 Server 角色的產品都可以使用，並不專屬於 Claude Code。實務上，這個協定是以訊息為基礎、依循 Host／Client／Server 的角色分工運作，因此考題通常聚焦在角色分工、能力類型、連線方式（Transport）與設定方式，而不是底層通訊協定的技術細節。",pitfall:"「MCP = Managed Control Plane」是最容易被誤導的錯誤聯想，正確全名務必記牢：Model Context Protocol。",example:"考題情境：MCP 的完整名稱是什麼？正解是 Model Context Protocol，用於連接 AI Application 與外部能力，而不是 Managed Control Plane、Multi-Channel Pipeline 或 Message Communication Platform 這些干擾選項。"},
      MCPHost:{what:"使用者實際操作、互動的 AI 應用程式本身（例如 Claude Code），內部包含一個或多個 MCP Client，負責與外部的 MCP Server 溝通。",why:"MCP 的角色分工共有四層：Host（使用者互動的應用程式）、MCP client（Host 內部負責講 MCP 協定的轉接器）、MCP server（暴露 Tools／Resources／Prompts 能力的外部程式或服務）、External system（MCP server 背後真正包裝的 API、資料庫或 SaaS 產品）。理解這個角色分工，有助於分辨考題中「誰在跟誰溝通」——使用者看到、操作的永遠是 Host，Host 底層才是真正在講協定的 MCP Client。",pitfall:"不要把 MCP Host 和 MCP Server 搞混——Host 是使用者面對的應用程式（如 Claude Code），Server 才是真正暴露能力、跑在外部的那一端。",example:"當你在 Claude Code 裡設定連上 Notion 的 MCP 整合時，Claude Code 本身就是 Host，Host 內部的 MCP Client 負責跟 Notion 的 MCP Server 溝通，Notion 的 MCP Server 再進一步連到 Notion 這個 External system 本身。"},
      MCPServer:{what:"透過 MCP 協定暴露能力的本機 Process 或遠端 Service，背後可能包裝著 API、資料庫或 SaaS 產品，例如 GitHub、Slack、PostgreSQL 或自訂的內部系統。",why:"MCP Server 對外暴露三種核心能力類型：Tools（Claude 可以呼叫的動作）、Resources（可讀取檢視的內容）、Prompts（可重用的提示範本或引導式工作流程）。連線方式（Transport）會依部署型態而異：遠端雲端服務通常建議用 HTTP（也支援 SSE 串流式連線），本機執行的程式則常用 stdio。設定上，Project scope 的 MCP 設定放在 Repo 根目錄的 `.mcp.json`（方便團隊共用、進版本控制，機密資訊透過環境變數帶入），而不是寫進 CLAUDE.md。",pitfall:"Project 層級的 MCP 伺服器設定應該放在 `.mcp.json`，這是常見的考試陷阱——很多人直覺會覺得應該寫進 CLAUDE.md，但這是錯誤的，CLAUDE.md 是行為指引，`.mcp.json` 才是 MCP 連線的設定檔。",example:"考題情境：遠端 Cloud SaaS MCP Server 一般建議使用哪個 Transport？正解是 HTTP——多數遠端 Service 建議用 HTTP，stdio 則適合本機執行的 Process，兩者依部署型態選擇，不是隨意互換。"},
      Resource:{what:"MCP 提供的「讀取型」能力，適合暴露文件、設定快照或大型穩定的參考資料，讓 Claude 可以取得並檢視內容，但語意上不是一個「帶參數執行動作」的操作。",why:"MCP 三種核心能力中，Tool 適合「Claude 需要採取行動或帶參數執行查詢」的情境（例如建立 GitHub Issue、搜尋事件記錄、執行 SQL 查詢）；Resource 則適合「Claude 需要唯讀的參考資料」（例如架構文件、儀表板快照、設定檔）。一個常見的設計失誤是把所有整合都做成 Tool——如果這個能力本質上就是唯讀的參考內容，用 Resource 通常更安全，對 Claude 來說也更容易正確使用（不用猜測參數、不用擔心誤觸發副作用）。",pitfall:"不是所有 Read-only 查詢都一定要做成 Resource——帶參數的搜尋類查詢仍可能更適合設計成 Tool；真正該用 Resource 的情境，是大型、穩定、可瀏覽的參考資料，而不是需要動態參數輸入的查詢。",example:"考題情境：MCP Server 的三種核心 Capability 是什麼？正解是 Tools、Resources、Prompts，分別對應「採取行動」「讀取內容」與「可重用的引導流程」，而不是 Tools、Schemas、Endpoints 這類混淆選項。"},
      PromptCapability:{what:"MCP 提供的可重用 Prompt 範本或引導式工作流程，讓常見的操作模式（例如發版檢查清單、PR 審查流程、事件應變演練）可以被封裝、重複呼叫，而不用每次都重新描述一次。",why:"這是 MCP 三種核心能力中專門處理「工作流程指引」的一類，與 Tool（採取行動）、Resource（讀取內容）互補。它讓團隊可以把重複出現的操作腳本標準化，透過 MCP 統一分享給所有連上這個 Server 的使用者，而不是散落在每個人各自的 Prompt 習慣裡。",pitfall:"不要把 MCP 的 Prompt 能力與一般聊天時臨時輸入的 Prompt 文字搞混——這裡指的是被結構化封裝、可重複呼叫的引導式工作流程，是 MCP Server 明確對外暴露的一種能力類型。",example:"一個內部維運用的 MCP Server，可以暴露一個「事件應變 Prompt」，內含標準化的排查步驟與檢查清單，讓任何連上這個 Server 的工程師都能直接呼叫同一套引導流程，而不需要每次重新拼湊指示。"},
      Transport:{what:"MCP Client 與 Server 之間實際採用的通訊方式；Claude Code 支援三種：HTTP（適合遠端服務）、SSE（適合遠端的串流式服務）與 stdio（適合本機執行的 Process）。",why:"選擇哪種 Transport，取決於 MCP Server 部署在哪裡：連接雲端 SaaS 服務（例如 Notion、Asana）通常建議用 HTTP；需要持續推送訊息、串流回應的情境適合 SSE；而在本機執行、與開發環境緊密整合的工具（例如本機資料庫 Adapter）則適合用 stdio 直接啟動子程序溝通。這個選擇也連動到部署位置：本機工程工具透過 stdio MCP Server，共享的 SaaS 整合透過 HTTP MCP Server，是官方文件明確給出的實務模式。",pitfall:"不要把三種 Transport 當成可以隨意互換的選項——遠端雲端服務與本機 Process 適合的 Transport 並不相同，考題經常會設計成「這個情境該選哪一種」的判斷題。",example:"考題情境：遠端 Cloud SaaS MCP Server 一般建議使用哪個 Transport？正解是 HTTP，而 stdio 則適合連接本機執行的 Process，例如透過 `npx` 啟動的本機資料庫工具。"},
      ToolDescription:{what:"告訴 Claude「何時該用這個工具」「會回傳什麼」「什麼情況不該用它」的說明文字，是模型決定要不要呼叫、要呼叫哪一個工具時最主要的判斷依據。",why:"官方明確指出好的 Tool description 是「為了 Routing，不是為了行銷」——它應該回答三個問題：Claude 什麼時候該用這個工具？它會回傳什麼？Claude 不應該拿它做什麼？好的範例像是「Fetch one Jira issue by key. Use when the user already provided an issue key like ENG-4521.」，具體、有情境；不好的範例則像「Interact with Jira.」，模糊到讓模型無從判斷。當多個工具名稱與描述都太模糊時，第一個最有效的改善方式，永遠是先把描述、輸入格式、使用邊界與範例寫清楚，而不是急著疊加新的架構層。",pitfall:"遇到工具選擇錯誤的問題時，不要急著往「增加 Routing layer」或「合併成萬用工具」的方向解決——這類架構性補丁往往治標不治本；真正該優先修正的根因，通常就是把 Tool description 本身寫得更精確、更具體。",example:"考題情境：兩個 Tool 名稱與描述都太模糊，造成錯誤選擇，第一個最有效改善是什麼？正解是「擴寫描述、輸入格式、邊界與 Examples」，而不是直接換更大的模型或合併成一個萬用工具——Tool description 是模型做 Routing 判斷的主要依據，先治本通常比新增架構更有效。"},
      Context:{what:"Claude 在當下這次請求中，實際能「看見」的所有內容總和：System prompt、Messages 歷史、Tool definitions、Tool results，以及其他被載入的參考資料（例如 CLAUDE.md、Auto memory、Skill 描述）。",why:"Context 應該被當成一種「預算」（Budget）來管理，而不是「什麼都塞進去的垃圾桶」。即使 Claude Opus 4.6 與 Sonnet 4.6 提供高達 1M tokens 的超長 Context（Haiku 4.5 則是 200k），更大的 Context window 只是提供更大的容量，並不會自動讓內容更相關——更長的 Prompt 依然代表更高的成本與延遲，無關的歷史內容還是會跟真正需要的資訊互相競爭模型的注意力。Claude Code 啟動時就會載入 CLAUDE.md、Auto memory、MCP 工具名稱、Skill 描述與額外附加的 System prompt 內容，隨著工作進行，檔案讀取、規則比對、工具結果與摘要也會持續加進 Context 裡。",pitfall:"不要誤以為「用更大的 Context window（例如 1M tokens）」就解決了內容管理的問題——容量變大不代表不需要篩選，無關內容依然會拖累成本、延遲與模型的專注程度。",example:"在 Claude Code 裡工作一段時間後，執行 `/context` 指令可以看到目前 Context 使用量的即時分布——哪些是 CLAUDE.md、哪些是工具結果、哪些是歷史對話——藉此判斷是否該執行 `/compact` 或改用 Subagent 隔離大量的探索性讀取。"},
      ContextRot:{what:"隨著 Context 中累積越來越多無關內容，模型的專注度（Focus）、準確度與回憶能力（Recall）逐漸下降的現象——問題核心不是「儲存空間不夠」，而是「相關資訊被雜訊淹沒」。",why:"這是官方文件明確強調的核心觀念：即使有 1M tokens 的超大 Context window，也無法解決 Context rot，因為問題不在容量大小，而在於無關的歷史內容會持續增加成本、拉長延遲，並稀釋模型對真正重要資訊的注意力。這也是為什麼 Server-side compaction、Context editing、Prompt caching、Subagent 隔離都被視為必要的操作手段，而不是可有可無的優化選項。",pitfall:"常見誤解：以為升級到更大的 Context 模型（例如換成 1M Context 版本）就能解決 Context rot——這只是提供更大容量，完全不能解決「無關內容稀釋注意力」這個根本問題。",example:"考題情境：Context rot 指的是什麼？正解是「無關內容累積造成 Focus 與準確度下降」，而不是 Tool 權限遺失、Session 檔案毀損或 Prompt cache 過期這類不相關的選項。"},
      PromptCache:{what:"重用相同 Prompt 前綴（Prefix）的 KV cache 表示，用來降低重複性輸入內容的成本與延遲；快取的前綴順序固定為 Tools → System → Messages，且不等同於保存原始 Prompt 供日後恢復對話。",why:"Prompt caching 有兩種使用模式：自動快取（在頂層加上 `cache_control` 欄位）與明確快取（在特定可快取的區塊上分別標記 `cache_control`）。快取要能生效，前提是「被快取的前綴內容在不同請求之間必須真的保持穩定」——這也是為什麼快取斷點（Cache breakpoint）建議放在穩定不變的 Tool definitions 與 System prompt 上，而不是放在每次請求都會變動的區塊（例如帶有時間戳記或當前使用者訊息的內容），否則會造成快取失效（Cache miss）。預設存活時間（TTL）是 5 分鐘，另外也支援 1 小時的延長快取。它重用的是記憶體中暫存的 KV representation，並不是把你的原始 Prompt 儲存下來供日後 Resume 對話使用，這與 Conversation storage 或 Session persistence 是完全不同的概念。",pitfall:"不要把 Prompt caching 誤解成「等同於保存了對話記錄」——它純粹是記憶體中的運算表示重用機制，跟你日後恢復對話所需的 Conversation storage 或 Session persistence 完全是两回事。",example:"考題情境：Prompt caching 的 Prefix 順序是什麼？正解是 Tools → System → Messages——把穩定不變的 Tool definitions 與 System prompt 放在前面，是最容易命中快取（Cache hit）的排列方式，而不是三者互相獨立、或把易變的 Messages 放在最前面。"},
      Compaction:{what:"把較舊的對話內容自動摘要（Summarize）成一個 Compaction block，取代原始的長篇歷史內容，藉此維持長時間 Session 的可用性；目前是透過 `context_management.edits` 搭配特定策略啟用的 Beta 功能。",why:"運作邏輯是：API 偵測到輸入 Token 數超過觸發門檻 → Claude 把較舊的內容摘要起來 → 回應中附帶一個 `compaction` 區塊 → 你必須在下一次請求時把這個 Compaction block 原樣傳回去，API 才會據此忽略更早之前的內容。這是目前官方明確建議、針對「大多數長時間對話」的首選策略（相對於更精細但更需要人工判斷的 Context editing）。在 Claude Code 裡，對應的操作是 `/compact` 指令，用摘要取代冗長的對話歷史；但要注意，摘要有可能把精確的交易細節模糊化。",pitfall:"考試常見情境：摘要把精確的數字或日期（例如「15% 折扣」）模糊成籠統的敘述（例如「談過促銷」）。這種情況最佳修正方式，不是延後摘要或每次都送出完整歷史，而是把這類精確的交易事實另外存成結構化、每次都會載入的持久狀態（State），不要單純依賴自然語言摘要去保留關鍵細節。",example:"考題情境：摘要把 15% 折扣模糊成「談過促銷」，最佳修正是「把金額、日期等交易事實另存為持久 Case facts」——精確的交易事實應該放在結構化、每次都載入的 State 裡，而不是指望摘要文字保留所有細節，也不是靠延後摘要或送出完整歷史這種治標的做法。"},
      ContextEditing:{what:"一種比整體摘要更精準、更「手術式」的 Context 管理手段：針對已經確定沒有價值的特定內容做精準清除，目前記載的策略包括清除舊的 Tool results（Tool result clearing）與清除思考區塊（Thinking block clearing），需透過 Beta header 啟用。",why:"Context editing 與 Compaction 的差異在於「保留資訊的策略」不同：Compaction 是把整段舊內容摘要濃縮成一個區塊，Context editing 則是精準移除特定、已知無用的內容（而非整體改寫），適合你清楚知道「哪些舊的 Tool results 或 Thinking blocks 已經沒有價值」的情境。官方明確定位：Server-side compaction 是大多數長時間對話的預設優先選擇，Context editing 則是更精細、更手術式的選項，只有在你能明確判斷哪些內容該被移除時才優先使用。",pitfall:"不要把 Compaction 與 Context editing 當成同一件事的兩種說法——一個是「整體摘要」，一個是「精準清除特定內容」，考試經常直接考兩者的差異定義。",example:"考題情境：Compaction 與 Context editing 的差異是什麼？正解是「Compaction 做整體摘要；Editing 精準清除特定內容」——兩者目的都在控制 Context，但一個是全面性改寫，一個是針對性移除，而不是「完全相同」或「Editing 只處理 System prompt」這類錯誤描述。"},
      Backoff:{what:"在重試（Retry）之前逐步延長等待時間的策略，通常會加入隨機抖動（Jitter）避免所有客戶端在完全相同的時間點同時重試。",why:"這是應對速率限制（429 Rate limited）與服務過載（529 Service overloaded）這兩種不同錯誤情境的核心做法：正確處理方式是遵守伺服器回傳的 `retry-after` 標頭、搭配指數型的 Backoff、加上 Jitter，並主動降低並發量。Jitter 之所以重要，是因為如果所有客戶端都在完全相同的秒數後統一重試，會形成「Thundering herd」（雷群效應）——大量請求同時湧入反而讓過載狀況更嚴重；加入隨機抖動能讓重試時間點自然分散開來，避免這種連鎖效應。",pitfall:"429（速率限制）與 529（服務過載）不是同一件事，但常被誤認為可以用同一套邏輯處理——兩者都需要 Backoff 加 Jitter 並降低並發，但語意不同：429 是明確的流量限制訊號，529 則代表服務端本身正在過載。",example:"考題情境：遇到 HTTP 429 應如何處理？正解是「遵守 retry-after、Backoff 加 jitter 並降並發」——這是流量控制問題，需要讓自己的請求量降下來，而不是立即重試、直接換模型，或乾脆重開 Session。"},
      Budget:{what:"Agent Loop 執行時的硬性上限，例如最大回合數（`max_turns`）、最大花費金額（`max_budget_usd`）與截止時間（Deadline），一旦觸發即代表「安全煞車被啟動」，而不是代表任務已經成功完成。",why:"官方立場非常明確：Budget 應該在模型之外（Outside the model）被定義與強制執行，這是可靠性設計的核心原則之一。在 Claude Code 的 Print mode 中，對應的旗標是 `--max-turns`、`--max-budget-usd`，以及專門記載於 Print mode 的 `--fallback-model`（用來指定備援模型，但不應推論所有介面都支援這個參數）；在 Agent SDK 中，對應的概念是 `max_turns` / `maxTurns` 與 `max_budget_usd` / `maxBudgetUsd`。當 Budget 被觸發時，正確的處理方式是回報目前已完成的部分成果、尚未完成的項目，以及明確的停止原因——而不是假裝任務已經圓滿結束。",pitfall:"不要把「Budget 被觸發、Loop 被迫停止」誤解為「任務成功完成」——這只代表安全上限被啟動，程式應該誠實回報部分成果與停止原因，而不是隱瞞這個事實。",example:"考題情境：Claude Code Print mode 指定 Fallback model 的 Flag 是什麼？正解是 `--fallback-model`——這是文件明確記載、專屬於 Print mode 的參數，不應該假設它在所有使用介面（Surface）上都同樣支援。"},
      PermissionMode:{what:"Claude Code 對於「自主程度」的設定選項，官方記載的模式包括 `default`、`acceptEdits`、`plan`、`auto`、`bypassPermissions` 與 `dontAsk`，決定 Claude 在執行動作前需要多少人為核准。",why:"其中 `plan` 模式對可靠性特別重要：它讓 Claude 先做研究、提出修改計畫，經過確認之後才真正動手修改，是高風險操作前的重要煞車點。`auto` 模式則是用更高的自主性換取效率，但背後有一層分類器（Classifier）在動作執行前先做安全評估，且目前只在特定方案與 Claude Sonnet 4.6／Opus 4.6 上可用，並非所有第三方供應商介面（如 Bedrock、Vertex、Foundry）都支援——這是一項產品能力，而不只是一種 Prompt 技巧。`bypassPermissions` 則屬於高風險模式，只適合在你完全掌控的隔離環境中使用，而且會被 Subagent 繼承，需要格外謹慎。",pitfall:"常見的干擾選項是「delegate」模式——這不是一個真實存在的 Permission mode，官方文件中並沒有這個選項，`plan` 才是真正存在、且對可靠性設計至關重要的模式。",example:"在正式修改 Production 程式碼之前，先用 `plan` 模式讓 Claude 完整研究現況、提出具體修改計畫並列出風險，經過人工確認計畫合理後，才切換到允許實際編輯的模式動手執行，這是官方建議的高風險操作前置流程。"},
      HumanInLoop:{what:"在高風險、模糊不清、涉及敏感資料，或政策明確要求核准的節點，主動把工作交給人類做審查與最終核准，而不是完全交由模型自主決定。",why:"官方列出四種應該導入人工審查的情境：動作具有高度外部副作用時、模型即將碰觸 Production 系統或敏感資料時、輸出在重試與驗證之後仍然模糊不清時，以及政策明確要求核准（不論模型信心高低）時。這是一種「風險與責任設計」的思維，而不是「模型失敗後才啟動的備案」——換句話說，人工審查點應該是在設計階段就規劃好的固定關卡，而不是等到出錯了才臨時介入補救。實務例子包括：合併前的 PR 審查、部署前的核准、以及對驅動財務或法律流程的擷取記錄進行人工驗證。",pitfall:"不要把 Human-in-the-loop 想成「模型主動要求協助才啟動」的被動機制——正確理解是：高副作用、敏感、重試後仍模糊、或政策要求的節點，本來就應該預先設計成需要人工核准，而不是等模型失敗才補上這一關。",example:"考題情境：何時應把工作交給 Human reviewer？正解是「高副作用、敏感、重試後仍模糊或政策要求時」，而不是只有模型主動要求時、每十回合固定審查一次，或只有發生 API error 時才介入——這些都不是官方定義的正確觸發時機。"},
      Observability:{what:"透過 Logs、Metrics、Traces 與 Evals 等機制，掌握 Agent 系統的品質、成本、延遲（Latency）與錯誤趨勢；在 Claude Code 中包含 `--debug`、`--verbose`、Hooks、Session transcript 與 OpenTelemetry 相關設定，在 API／SDK 端則要監控 Request ID、輸入輸出 Token、快取讀寫、Compaction 使用情況與工具延遲／錯誤率。",why:"光記錄 Request ID 並不足以有效除錯——完整的可觀測性需要把 Session、`tool_use_id`、延遲、錯誤、Token 用量、快取命中情況，以及最終品質結果串接起來，才能真正定位問題發生在哪個環節。Agent SDK 的 Hooks 正是為此設計：記錄每一次工具呼叫、擋下危險操作、加上合規／稽核層，並追蹤 Session 生命週期事件。官方也提供 Usage & Cost API，方便持續監控 Token 消耗（包含快取讀寫）與花費趨勢，對於維持 Loop 在預算範圍內運作是關鍵工具。",pitfall:"只記錄 Request ID 是不夠的可觀測性設計——常見誤區是以為單一識別碼就能支撐完整除錯，但缺少 Latency、Error、Tokens、Cache 等維度的資訊時，仍然無法有效定位問題根因。",example:"考題情境：多個 MCP Tools 回傳日期與狀態格式不一致，最可維護的正規化位置是「使用 PostToolUse Hook 統一轉換」——這也是 Observability 落地的具體例子：透過 Hook 這個集中、確定且可測試的攔截點統一處理與記錄，比起在 Prompt 裡描述規則或讓 Claude 自行猜測更可靠也更容易追蹤。"}
    };

      zh:{brand:'完整視覺解說',foot:'完整版｜圖解＋白話說明<br>共 36 張 Slides',points:'你要記得',example:'實務例子',trap:'常見陷阱',memory:'一句話記憶',extras:'深入理解與考試練習',extrasSub:'先展開名詞與 FAQ，再用模擬題確認是否真的理解。',terms:'名詞定義與延伸說明',faq:'常見問題 FAQ',tip:'可用鍵盤 ← → 切換 Slides',unanswered:'本張尚未作答',correct:'本張答對 ✓',review:'本張待加強',single:'單選題',source:'題目參考',right:'答對了！',wrong:'答錯了，正確答案是',show:'查看解說',hide:'收合解說',retry:'重新作答',explanation:'解說：',q:'Q：',a:'A：',termWhat:'白話是什麼',termWhy:'為什麼重要／怎麼運作',termPitfall:'常見誤解',termExample:'具體例子'},
      en:{brand:'Original English Study Guide',foot:'Original English｜Source text<br>36 Slides',points:'Key points',example:'Original source point',trap:'Exam note',memory:'Source takeaway',extras:'Definitions, FAQ, and Exam Practice',extrasSub:'Expand the original-source definitions and rationale, then answer the practice question.',terms:'Definitions from the original source',faq:'Frequently asked question',tip:'Use the ← → keys to change slides',unanswered:'Not answered',correct:'Correct ✓',review:'Review this concept',single:'Single choice',source:'Source',right:'Correct!',wrong:'Incorrect. The correct answer is',show:'Show rationale',hide:'Hide rationale',retry:'Try again',explanation:'Rationale: ',q:'Question: ',a:'Answer: '}
    };
    const NODE_EN = {
      '你':'User','目標':'Goal','判斷':'Decide','行動':'Act','成果':'Result','交付':'Deliver','觀察':'Observe','更新':'Update',
      '自己寫 Loop・Session':'Build the loop and session yourself','Loop・Tools・Session 內建':'Built-in loop, tools, and sessions','決定':'Decide','系統':'Application','執行':'Execute','同一 id':'Same id',
      '研究員':'Researcher','大量查詢':'Large-scale research','工程師':'Engineer','專注實作':'Focused implementation','分工':'Delegate','審查員':'Reviewer','獨立檢查':'Independent review','只回精華':'Final message only',
      '不同任務送不同專家':'Route tasks to specialists','互不依賴就同時做':'Run independent work in parallel','拆解・分工・合併':'Decompose, delegate, and merge','產生與批改反覆迭代':'Generate, evaluate, and refine',
      'Created｜新對話':'Created | New conversation','Active｜Tools 與結果':'Active | Tools and results','Suspended｜暫停':'Suspended','Resume / Fork｜再出發':'Resume / Fork',
      '權限':'Permissions','去重':'Deduplication','稽核':'Audit','受控行動':'Controlled actions','可重用工作流程':'Reusable workflows',
      'Managed｜全公司':'Managed | Organization','User｜個人偏好':'User | Personal preferences','Project｜團隊規範':'Project | Team instructions','Subdir｜局部需求':'Subdirectory | Local instructions',
      '這個 Repo 是什麼':'What this repository is','如何 Build / Test':'How to build and test','不可違反的工程慣例':'Non-negotiable engineering rules','詳細資料拆出去':'Move details into imports',
      '按路徑載入':'Path-scoped loading','使用者呼叫':'User invocation','指示・參數':'Instructions and arguments','受限執行':'Restricted execution','固定格式':'Required output','不可覆寫':'Cannot be overridden','受控工具':'Controlled tools',
      '要做什麼':'What to do','分開不同區段':'Separate sections','示範成功樣子':'Demonstrate the desired output','案例':'Input','正確':'Correct','歸納':'Infer','一致':'Consistent output','自然語言輸入':'Natural-language input','可解析 JSON':'Parseable JSON',
      '語意理解':'Contextual understanding','固定欄位':'Schema fields','程式檢查':'Application validation','格式・風格・政策':'Format, style, and policy','推理深度・難題':'Reasoning depth',
      '你的 App 執行':'Your application executes','Anthropic 執行':'Anthropic executes','MCP Server 執行':'MCP server executes','選擇與組合':'Choose and combine','外部系統':'External systems',
      '採取動作':'Actions','讀取內容':'Read-oriented content','能力目錄':'Capabilities','重用流程':'Reusable workflow','選擇使用':'Select capability','遠端服務':'Remote services','本機 Process':'Local process',
      'create / get / list 分開':'Separate create, get, and list','enum・少 Optional':'Enums and few optional fields','可恢復訊息':'Recoverable error','受控能力':'Controlled capabilities',
      '全部歷史｜慢又貴':'Full history | Slow and expensive','相關內容｜先篩選':'Relevant context | Filter first','摘要與快取｜再濃縮':'Summaries and caching','當下重點｜最清楚':'Current task state',
      '看 Token':'Inspect tokens','摘要歷史':'Summarize history','保持專注':'Keep the main context focused','隔離探索':'Isolate exploration','檢查載入':'Inspect loaded memory',
      '穩定 definitions':'Stable definitions','固定 instructions':'Stable instructions','可重用內容':'Reusable content','每次變動':'Per-request content','送出前估算':'Count before sending','摘要舊歷史':'Summarize older context','清除舊 Tool results':'Clear old tool results','控制推理深度':'Control reasoning effort',
      '可以 Retry':'Retry','不要盲試':'Do not retry blindly','有限運作':'Bounded operation','研究':'Research','人看計畫':'Human reviews the plan','受控修改':'Controlled changes','高風險操作':'High-risk action','品質趨勢':'Quality trends'
    };
    const TERM_LABELS = {
      MessagesAPI:'Messages API', AgentSDK:'Agent SDK', tool_use:'tool_use', tool_result:'tool_result',
      CLAUDEmd:'CLAUDE.md', LazyLoad:'Lazy loading', allowed_tools:'allowed-tools', CICD:'CI/CD',
      SystemPrompt:'System prompt', FewShot:'Few-shot prompting', JSONOutputs:'JSON outputs',
      StrictTool:'Strict tool use', AdaptiveThinking:'Adaptive thinking', ClientTool:'Client tool',
      ServerTool:'Anthropic server tool', MCPHost:'MCP Host', MCPServer:'MCP Server',
      PromptCapability:'MCP Prompt', ToolDescription:'Tool description', ContextRot:'Context rot',
      PromptCache:'Prompt caching', ContextEditing:'Context editing', HumanInLoop:'Human-in-the-loop',
      PermissionMode:'Permission mode'
    };

    function localizedVisual(item) {
      if(state.lang !== 'en') return item;
      const localize = value => NODE_EN[value] || value;
      return {...item,nodes:(item.nodes||[]).map(node=>node.map(localize)),core:Array.isArray(item.core)?item.core.map(localize):item.core};
    }
    function parts(node) { return `<strong>${node[0]}</strong>${node[1] ? `<small>${node[1]}</small>` : ''}`; }
    function draw(item) {
      if (item.kind === 'flow') return `<div class="flow" role="img" aria-label="${item.t}">${item.nodes.map((n,i)=>`<div class="node ${i===item.key?'key':''}">${parts(n)}</div>${i<item.nodes.length-1?'<span class="arrow" aria-hidden="true">→</span>':''}`).join('')}</div>`;
      if (item.kind === 'split') return `<div class="split" role="img" aria-label="${item.t}"><div class="panel">${parts(item.nodes[0])}</div><div class="vs">VS</div><div class="panel">${parts(item.nodes[1])}</div></div>`;
      if (item.kind === 'stack') return `<div class="stack" role="img" aria-label="${item.t}">${item.nodes.map(n=>`<div class="stack-row"><span class="idx">${n[0]}</span><strong>${n[1]}</strong><small>${n[2]}</small></div>`).join('')}</div>`;
      if (item.kind === 'hub') return `<div class="hub" role="img" aria-label="${item.t}">${item.nodes.map((n,i)=>`<div class="hub-node ${i===item.key?'hub-center':''}">${parts(n)}</div>`).join('')}</div>`;
      if (item.kind === 'cycle') return `<div class="cycle" role="img" aria-label="${item.t}">${item.nodes.map(n=>`<div class="cycle-node">${parts(n)}</div>`).join('')}<div class="cycle-core">↻<br>${item.core}</div></div>`;
      if (item.kind === 'funnel') return `<div class="funnel" role="img" aria-label="${item.t}">${item.nodes.map(n=>`<div class="funnel-row">${n[0]}</div>`).join('')}</div>`;
      if (item.kind === 'shield') return `<div class="shield" role="img" aria-label="${item.t}"><div class="shield-shape"></div><div class="core">${parts(item.core)}</div><div class="chips">${item.nodes.map(n=>`<div class="chip">${parts(n)}</div>`).join('')}</div></div>`;
      return '';
    }

    function renderDomainNav() {
      domainNav.innerHTML = domains.map((d,i)=>`<button class="domain-btn" data-domain="${i}" aria-current="${i===state.domain}"><span class="num">${d.number}</span><span class="domain-name">${d.title}</span><span class="weight">${d.weight}</span></button>`).join('');
      domainNav.querySelectorAll('[data-domain]').forEach(b=>b.addEventListener('click',()=>{state.domain=Number(b.dataset.domain);state.slide=0;render();}));
    }
    function renderSlideNav(domain) {
      slideNav.innerHTML = domain.slides.map((s,i)=>`<button class="slide-btn" data-slide="${i}" aria-pressed="${i===state.slide}">${state.lang==='en'?(ORIGINAL_EN_SLIDES[state.domain][i].tab||s.tab):s.tab}</button>`).join('');
      slideNav.querySelectorAll('[data-slide]').forEach(b=>b.addEventListener('click',()=>{state.slide=Number(b.dataset.slide);render();}));
    }
    function renderTermRow(key) {
      const label = TERM_LABELS[key] || key;
      if (state.lang === 'en') {
        return `<div class="term-row"><strong>${label}</strong><p>${TERM_LIBRARY_EN[key] || ''}</p></div>`;
      }
      const u = UI.zh;
      const term = TERM_LIBRARY[key];
      if (!term) return '';
      return `<div class="term-row">
        <div class="term-row-head"><strong>${label}</strong><span class="term-tag">${key}</span></div>
        <div class="term-block what"><div class="term-block-label"><span class="dot"></span>${u.termWhat}</div><p>${term.what}</p></div>
        <div class="term-block why"><div class="term-block-label"><span class="dot"></span>${u.termWhy}</div><p>${term.why}</p></div>
        <div class="term-block pitfall"><div class="term-block-label"><span class="dot"></span>${u.termPitfall}</div><p>${term.pitfall}</p></div>
        <div class="term-block example"><div class="term-block-label"><span class="dot"></span>${u.termExample}</div><p>${term.example}</p></div>
      </div>`;
    }
    function renderExtras() {
      const extra = EXTRAS[state.domain][state.slide];
      const u=UI[state.lang];
      $('terms').innerHTML = extra.terms.map(key=>renderTermRow(key)).join('');
      const quiz=state.lang==='en'?ORIGINAL_EN_QUIZZES[state.domain][state.slide]:extra.q;
      const faq=state.lang==='en'?[[quiz.text,quiz.x]]:extra.faq;
      $('faqs').innerHTML = faq.map(item=>`<div class="faq-row"><strong>${u.q}${item[0]}</strong><p>${u.a}${item[1]}</p></div>`).join('');
      renderQuiz(quiz);
    }
    function renderQuiz(q) {
      const qid = `${state.lang}-${state.domain}-${state.slide}`;
      const u=UI[state.lang];
      const selected = state.answers[qid];
      const answered = selected !== undefined;
      const correct = answered && selected === q.a;
      const showExplanation = Boolean(state.explanations[qid]);
      $('quiz-score').textContent = answered ? (correct ? u.correct : u.review) : u.unanswered;
      $('quiz-area').innerHTML = `<div class="quiz-card">
        <div class="quiz-meta"><span class="quiz-source">${u.source}：${q.src}</span><span>${u.single}</span></div>
        <p class="quiz-question">${q.text}</p>
        <div class="quiz-options">${q.o.map((option,index)=>{
          let cls = 'quiz-option';
          if(answered && index === q.a) cls += ' correct';
          if(answered && index === selected && index !== q.a) cls += ' wrong';
          return `<button type="button" class="${cls}" data-answer="${index}" ${answered?'disabled':''}><span class="quiz-letter">${String.fromCharCode(65+index)}</span><span>${option}</span></button>`;
        }).join('')}</div>
        ${answered ? `<div class="quiz-result"><strong class="${correct?'correct-text':'wrong-text'}">${correct?u.right:u.wrong+' '+String.fromCharCode(65+q.a)+'.'}</strong><div><button type="button" class="quiz-action" data-explain>${showExplanation?u.hide:u.show}</button> <button type="button" class="quiz-action" data-retry>${u.retry}</button></div></div>${showExplanation?`<div class="quiz-explanation"><strong>${u.explanation}</strong>${q.x}</div>`:''}` : ''}
      </div>`;
      $('quiz-area').querySelectorAll('[data-answer]').forEach(button=>button.addEventListener('click',()=>{
        state.answers[qid]=Number(button.dataset.answer); renderQuiz(q);
      }));
      const explainButton = $('quiz-area').querySelector('[data-explain]');
      if(explainButton) explainButton.addEventListener('click',()=>{state.explanations[qid]=!state.explanations[qid];renderQuiz(q);});
      const retryButton = $('quiz-area').querySelector('[data-retry]');
      if(retryButton) retryButton.addEventListener('click',()=>{delete state.answers[qid];delete state.explanations[qid];renderQuiz(q);});
    }
    function renderUI() {
      const u=UI[state.lang];
      $('brand-sub').textContent=u.brand; $('side-foot').innerHTML=u.foot; $('label-points').textContent=u.points; $('label-example').textContent=u.example;
      $('label-trap').textContent=u.trap; $('label-memory').textContent=u.memory; $('extras-title').textContent=u.extras; $('extras-sub').textContent=u.extrasSub;
      $('terms-summary').textContent=u.terms; $('faq-summary').textContent=u.faq; $('pager-tip').textContent=u.tip;
      $('lang-zh').setAttribute('aria-pressed',String(state.lang==='zh')); $('lang-en').setAttribute('aria-pressed',String(state.lang==='en'));
      document.documentElement.lang=state.lang==='en'?'en':'zh-Hant-TW';
    }
    function render() {
      const d=domains[state.domain], s=d.slides[state.slide];
      const en=ORIGINAL_EN_SLIDES[state.domain][state.slide];
      const sourcePoints=en.points.length?en.points:[en.subtitle];
      $('domain-label').textContent=`Domain ${d.number} ・ ${d.weight}`; $('domain-title').textContent=d.title; $('progress').textContent=`${state.slide+1} / ${d.slides.length}`;
      const originalPlain=en.plain||sourcePoints.join(' ')||en.subtitle;
      $('kicker').textContent=state.lang==='en'?'Original source':s.k; $('title').textContent=state.lang==='en'?en.title:s.t; $('subtitle').textContent=state.lang==='en'?(en.subtitle||sourcePoints[0]):s.s; $('visual').innerHTML=draw(localizedVisual(s)); $('plain').textContent=state.lang==='en'?originalPlain:s.plain;
      const points=state.lang==='en'?sourcePoints:s.points; $('points').innerHTML=points.map(p=>`<li>${p}</li>`).join('');
      $('example').textContent=state.lang==='en'?(sourcePoints[0]||en.plain):s.example; $('code').textContent=s.code; $('trap').textContent=state.lang==='en'?(sourcePoints[1]||en.subtitle):s.trap; $('memory').textContent=state.lang==='en'?(sourcePoints[2]||en.subtitle):s.memory;
      renderUI(); renderExtras(); renderDomainNav(); renderSlideNav(d); document.title=state.lang==='en'?`Domain ${d.number} | ${en.title} | Claude Architect`:`Domain ${d.number}｜${s.tab}｜Claude Architect 完整視覺解說`;
    }
    function move(delta) {
      const d=domains[state.domain], n=state.slide+delta;
      if(n>=0&&n<d.slides.length) state.slide=n;
      else if(delta>0&&state.domain<domains.length-1){state.domain++;state.slide=0;}
      else if(delta<0&&state.domain>0){state.domain--;state.slide=domains[state.domain].slides.length-1;}
      render(); window.scrollTo({top:0,behavior:'smooth'});
    }
    $('prev').addEventListener('click',()=>move(-1)); $('next').addEventListener('click',()=>move(1));
    $('lang-zh').addEventListener('click',()=>{state.lang='zh';render();}); $('lang-en').addEventListener('click',()=>{state.lang='en';render();});
    document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});
    render();
  </script>
</body>
