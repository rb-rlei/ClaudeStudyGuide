    const ORIGINAL_EN_SLIDES = [[{"tab":"Key definitions","title":"Key definitions","subtitle":"Agentic loop: An iterative control structure that repeatedly (a) forms/updates an internal state estimate, (b) decides next actions, (c) acts through tools or environment interactions, (d) incorporates feedback, and (e) terminates under explicit conditions (goal achieved, budget exhausted, error).","plain":"Agentic loop: An iterative control structure that repeatedly (a) forms/updates an internal state estimate, (b) decides next actions, (c) acts through tools or environment interactions, (d) incorporates feedback, and (e) terminates under explicit conditions (goal achieved, budget exhausted, error). This general framing matches “reason+act interleaving” approaches such as ReAct. Tool-using LLM agent: An LLM that can choose when to call external tools and incorporate results into subsequent reasoning (e.g., Toolformer’s view of models selecting/using APIs; MRKL’s modular composition with discrete modules). Claude implements this behavior through tool definitions, tool_use requests, and tool_result responses.","points":["Agentic loop: An iterative control structure that repeatedly (a) forms/updates an internal state estimate, (b) decides next actions, (c) acts through tools or environment interactions, (d) incorporates feedback, and (e) terminates under explicit conditions (goal achieved, budget exhausted, error).","This general framing matches “reason+act interleaving” approaches such as ReAct.","Tool-using LLM agent: An LLM that can choose when to call external tools and incorporate results into subsequent reasoning (e."]},{"tab":"Designing agentic loops on Claude","title":"Designing agentic loops on Claude","subtitle":"Agentic loop: An iterative control structure that repeatedly (a) forms/updates an internal state estimate, (b) decides next actions, (c) acts through tools or environment interactions, (d) incorporates feedback, and (e) terminates under explicit conditions (goal achieved, budget exhausted, error).","plain":"Agentic loop: An iterative control structure that repeatedly (a) forms/updates an internal state estimate, (b) decides next actions, (c) acts through tools or environment interactions, (d) incorporates feedback, and (e) terminates under explicit conditions (goal achieved, budget exhausted, error). This general framing matches “reason+act interleaving” approaches such as ReAct. Tool-using LLM agent: An LLM that can choose when to call external tools and incorporate results into subsequent reasoning (e.g., Toolformer’s view of models selecting/using APIs; MRKL’s modular composition with discrete modules). Claude implements this behavior through tool definitions, tool_use requests, and tool_result responses.","points":["Agentic loop: An iterative control structure that repeatedly (a) forms/updates an internal state estimate, (b) decides next actions, (c) acts through tools or environment interactions, (d) incorporates feedback, and (e) terminates under explicit conditions (goal achieved, budget exhausted, error).","This general framing matches “reason+act interleaving” approaches such as ReAct.","Tool-using LLM agent: An LLM that can choose when to call external tools and incorporate results into subsequent reasoning (e."]},{"tab":"When to offload the loop to the platform: Tool Runner and Agent SDK","title":"When to offload the loop to the platform: Tool Runner and Agent SDK","subtitle":"If you want “tool loop orchestration” but not the full Agent SDK environment, Anthropic’s tool-use docs describe an SDK “tool runner” that repeatedly checks for tool requests, executes tools, appends tool results, and continues until Claude returns no tool use.","plain":"If you want “tool loop orchestration” but not the full Agent SDK environment, Anthropic’s tool-use docs describe an SDK “tool runner” that repeatedly checks for tool requests, executes tools, appends tool results, and continues until Claude returns no tool use. If you need persistent environments, permissions, sessions, subagents, and deeper observability, the Agent SDK is the canonical approach; it exposes the loop, turn budgeting, message stream types, and automatic prompt caching.","points":["If you want “tool loop orchestration” but not the full Agent SDK environment, Anthropic’s tool-use docs describe an SDK “tool runner” that repeatedly checks for tool requests, executes tools, appends tool results, and continues until Claude returns no tool use.","If you need persistent environments, permissions, sessions, subagents, and deeper observability, the Agent SDK is the canonical approach; it exposes the loop, turn budgeting, message stream types, and automatic prompt caching."]},{"tab":"Messages API fundamentals that shape loop design","title":"Messages API fundamentals that shape loop design","subtitle":"The Messages API is stateless: every call must include the needed conversation history (and you may inject synthetic assistant messages if your orchestration needs them).","plain":"The Messages API is stateless: every call must include the needed conversation history (and you may inject synthetic assistant messages if your orchestration needs them). This means “session” is an application-level construct unless you use the Agent SDK. Tool use is a first-class loop primitive. When Claude decides it needs a tool, the response includes:","points":["The Messages API is stateless: every call must include the needed conversation history (and you may inject synthetic assistant messages if your orchestration needs them).","This means “session” is an application-level construct unless you use the Agent SDK.","Tool use is a first-class loop primitive."]},{"tab":"Agent SDK primitives that shape loop and session architecture","title":"Agent SDK primitives that shape loop and session architecture","subtitle":"The Agent SDK exposes Claude Code’s “autonomous loop” as a library: Claude evaluates the prompt, calls tools, receives tool results, and repeats until completion.","plain":"The Agent SDK exposes Claude Code’s “autonomous loop” as a library: Claude evaluates the prompt, calls tools, receives tool results, and repeats until completion. A turn is one internal round-trip where Claude emits tool calls, the SDK executes them, and results feed back to Claude; the loop ends when Claude produces output with no tool calls. The SDK provides explicit guardrails:","points":["The Agent SDK exposes Claude Code’s “autonomous loop” as a library: Claude evaluates the prompt, calls tools, receives tool results, and repeats until completion.","A turn is one internal round-trip where Claude emits tool calls, the SDK executes them, and results feed back to Claude; the loop ends when Claude produces output with no tool calls."]},{"tab":"Canonical patterns and how they map to Claude","title":"Canonical patterns and how they map to Claude","subtitle":"Claude supports multi-agent in two main ways: Multiple independent Claude calls with different system prompts (classic “multi-LLM workflows”).","plain":"Claude supports multi-agent in two main ways: Multiple independent Claude calls with different system prompts (classic “multi-LLM workflows”). Agent SDK subagents, where the parent agent invokes specialized agents with isolated contexts, optional tool restrictions, and optional model overrides, returning only the subagent’s final output.","points":["Claude supports multi-agent in two main ways: Multiple independent Claude calls with different system prompts (classic “multi-LLM workflows”).","Agent SDK subagents, where the parent agent invokes specialized agents with isolated contexts, optional tool restrictions, and optional model overrides, returning only the subagent’s final output."]},{"tab":"Agent SDK session operations: continue, resume, fork","title":"Agent SDK session operations: continue, resume, fork","subtitle":"Continue: finds the most recent session in the current directory (TypeScript: continue: true; Python: continue_conversation=True).","plain":"Continue: finds the most recent session in the current directory (TypeScript: continue: true; Python: continue_conversation=True). Resume: resumes a specific session by ID, enabling multi-user apps where each user maps to a session ID. Fork: creates a new session with a copy of history but diverges from that point; branching history is not branching filesystem changes. Stateless option: TypeScript can set persistSession: false so the session exists only in memory; Python always persists to disk. Sessions are stored under ~/.claude/projects/<encoded-cwd>/*.jsonl, and resuming can fail if cwd differs across runs. Resuming across hosts requires copying the session file to the same path (and matching cwd), or avoiding resume and instead passing key state into a new session prompt.","points":["Continue: finds the most recent session in the current directory (TypeScript: continue: true; Python: continue_conversation=True).","Resume: resumes a specific session by ID, enabling multi-user apps where each user maps to a session ID.","Fork: creates a new session with a copy of history but diverges from that point; branching history is not branching filesystem changes."]},{"tab":"Security and privacy implications","title":"Security and privacy implications","subtitle":"Data retention and ZDR.","plain":"Data retention and ZDR. Anthropic documents ZDR scope and exceptions: For ZDR-enabled endpoints, customer data is not stored at rest after the response except where needed for law/misuse; retained data is not used for model training without express permission. CORS is not supported for ZDR organizations; browser apps must use a backend proxy and must never expose API keys in browser JavaScript.","points":["Data retention and ZDR.","Anthropic documents ZDR scope and exceptions: For ZDR-enabled endpoints, customer data is not stored at rest after the response except where needed for law/misuse; retained data is not used for model training without express permission.","CORS is not supported for ZDR organizations; browser apps must use a backend proxy and must never expose API keys in browser JavaScript."]}],[{"tab":"Executive Summary","title":"Executive Summary","subtitle":"Claude Code’s configuration and automation ecosystem can be understood as four interacting layers: memory (CLAUDE.","plain":"Claude Code’s configuration and automation ecosystem can be understood as four interacting layers: memory (CLAUDE.md + rules), skills (custom slash commands), enforcement (settings/permissions/sandboxing/hooks), and delivery (CI/CD + managed deployments). CLAUDE.md is the core “project memory” mechanism: a Markdown file (or set of files) that Claude Code automatically loads to provide persistent project context and working conventions, reducing repeated onboarding per session. There is no required format, but Anthropic recommends concise, structured, concrete instructions, typically targeting under ~200 lines per CLAUDE.md for better adherence. Claude Code supports a hierarchical loading model for CLAUDE.md and rules: organization-wide managed policy (OS-level path), user-wide (~/.claude/CLAUDE.md), project-wide (./CLAUDE.md or ./.claude/CLAUDE.md), plus additional CLAUDE.md files in ancestor directories; CLAUDE.md files in subdirectories are lazy-loaded when Claude reads files in those directories. For scale, Anthropic recommends modularizing with .claude/rules/ (optionally path-scoped via YAML frontmatter) and with @path/to/import imports (recursive up to five hops).","points":["Claude Code’s configuration and automation ecosystem can be understood as four interacting layers: memory (CLAUDE.","md + rules), skills (custom slash commands), enforcement (settings/permissions/sandboxing/hooks), and delivery (CI/CD + managed deployments).","CLAUDE."]},{"tab":"Canonical locations and precedence","title":"Canonical locations and precedence","subtitle":"Claude Code supports multiple CLAUDE.","plain":"Claude Code supports multiple CLAUDE.md locations (different scopes). In official docs, the key ones are: macOS: /Library/Application Support/ClaudeCode/CLAUDE.md Linux/WSL: /etc/claude-code/CLAUDE.md Windows: C:\\Program Files\\ClaudeCode\\CLAUDE.md This file is intended for company-wide standards and cannot be excluded by user settings.","points":["Managed policy (organization-wide):","Project instructions (team/shared): ./CLAUDE.md or ./.claude/CLAUDE.md","User instructions (personal): ~/.claude/CLAUDE.md"]},{"tab":"What CLAUDE.md is (and is not)","title":"What CLAUDE.md is (and is not)","subtitle":"CLAUDE.","plain":"CLAUDE.md is a Markdown “project memory” file that Claude Code reads at the start of sessions to provide persistent context and instructions; it is treated as contextual guidance (not a hard enforcement mechanism), so clarity and specificity strongly affect compliance. Anthropic explicitly notes there is no required format. Best results come from concise sections that are easy for both humans and Claude to scan (headers, bullets, concrete rules).","points":["CLAUDE.","md is a Markdown “project memory” file that Claude Code reads at the start of sessions to provide persistent context and instructions; it is treated as contextual guidance (not a hard enforcement mechanism), so clarity and specificity strongly affect compliance.","Anthropic explicitly notes there is no required format."]},{"tab":"Scaling beyond a single file: .claude/rules/","title":"Scaling beyond a single file: .claude/rules/","subtitle":"For larger projects, Anthropic recommends modular instruction files under .","plain":"For larger projects, Anthropic recommends modular instruction files under .claude/rules/. Rules can be discovered recursively and kept topic-focused (testing.md, security.md, etc.). Rules support YAML frontmatter with paths to scope rules to particular files/directories using glob patterns (including brace expansion). Rules without paths load unconditionally at launch (with the same priority as .claude/CLAUDE.md).","points":["For larger projects, Anthropic recommends modular instruction files under .","claude/rules/.","Rules can be discovered recursively and kept topic-focused (testing."]},{"tab":"Skill file format and metadata fields","title":"Skill file format and metadata fields","subtitle":"Key frontmatter fields include name, description, argument-hint, disable-model-invocation, user-invocable, allowed-tools, model, effort, context (e.","plain":"Key frontmatter fields include name, description, argument-hint, disable-model-invocation, user-invocable, allowed-tools, model, effort, context (e.g., fork), agent, hooks, paths (path-scoped activation), and shell. Skills support structured argument substitution:","points":["Optional YAML frontmatter between --- markers","Markdown instructions (the “prompt playbook”)","$ARGUMENTS (all arguments)"]},{"tab":"Settings scopes: managed, user, project, and local","title":"Settings scopes: managed, user, project, and local","subtitle":"CLAUDE.","plain":"CLAUDE.md is only one half of configuration. Claude Code also uses hierarchical settings files: This distinction is exam-relevant because settings are the enforcement mechanism, while CLAUDE.md remains guidance. A common pattern is: put team-shared permissions, hooks, plugins, and MCP servers in project settings; keep machine-specific or experimental overrides in settings.local.json; and reserve managed settings for non-overrideable enterprise policy.","points":["User: ~/.claude/settings.json","Project: .claude/settings.json","Local (personal overrides for one repo): .claude/settings.local.json"]},{"tab":"CI/CD Integration Patterns and Provider-Specific Pipelines","title":"CI/CD Integration Patterns and Provider-Specific Pipelines","subtitle":"There are three practical CI/CD goals for Claude Code configuration: Validation: Treat CLAUDE.","plain":"There are three practical CI/CD goals for Claude Code configuration: Validation: Treat CLAUDE.md, .claude/rules/, .claude/skills/, and .claude/settings.json like critical build policy (“policy-as-code”). Fail fast on broken imports, contradictory rules, unsafe tool grants, or accidental secrets. This is aligned with Anthropic’s explicit guidance to use settings/permissions for enforcement and CLAUDE.md for behavioral guidance.","points":["Trigger scoping: run only when CLAUDE.md, .claude/rules/, .claude/skills/, .claude/settings*.json change.","Static checks: markdown lint, YAML frontmatter sanity, import resolution, size budgets, secret scanning.","Policy checks: ensure no forbidden patterns like “external imports in shared CLAUDE.md” (if your org requires), ensure skills don’t grant overly-broad allowed-tools without justification."]}],[{"tab":"Executive Summary","title":"Executive Summary","subtitle":"Prompt engineering on Claude is about reducing ambiguity.","plain":"Prompt engineering on Claude is about reducing ambiguity. The most reliable pattern is: (1) give a clear task, (2) separate sections with XML tags, (3) provide representative examples, and (4) constrain the output when another system has to parse it. For structured output, Anthropic exposes two related features:","points":["JSON outputs via output_config.format when you want Claude's final answer in schema-conformant JSON","Strict tool use via strict: true when you want tool names and tool inputs to match schema exactly"]},{"tab":"Few-Shot Prompting","title":"Few-Shot Prompting","subtitle":"Few-shot prompting means teaching by example inside the prompt.","plain":"Few-shot prompting means teaching by example inside the prompt. On Claude, examples often outperform extra prose because they show the desired structure, tone, and decision rule directly. Anthropic generally recommends delimiting prompt sections with XML-style tags so the model can separate instructions, examples, and live input.","points":["Start with a few representative examples, then add more only when they improve a failure mode you can observe.","Match the examples to the real task as closely as possible.","Cover edge cases deliberately instead of hoping the model generalizes."]},{"tab":"Structured Outputs and JSON Schema","title":"Structured Outputs and JSON Schema","subtitle":"Structured outputs are for cases where downstream code must parse Claude's answer safely.","plain":"Structured outputs are for cases where downstream code must parse Claude's answer safely. JSON outputs are ideal for extraction, classification, and report generation. Strict tool use is ideal when Claude must call your functions with validated inputs.","points":["The Messages API uses output_config.format for JSON outputs.","Python and TypeScript SDK helpers may still expose convenience wrappers such as output_format / outputFormat, then translate them into the API shape for you.","Structured outputs use grammar-constrained decoding, so the first request for a new schema can be slower while the grammar is compiled."]},{"tab":"Strict tool use example","title":"Strict tool use example","subtitle":"With strict: true, Claude's tool calls must match the declared schema exactly.","plain":"With strict: true, Claude's tool calls must match the declared schema exactly. This is the right mechanism when your application logic depends on reliable tool arguments, not just reliable final text.","points":["With strict: true, Claude's tool calls must match the declared schema exactly.","This is the right mechanism when your application logic depends on reliable tool arguments, not just reliable final text."]},{"tab":"Data Extraction Patterns","title":"Data Extraction Patterns","subtitle":"Data extraction is where prompt engineering and structured outputs meet operational reality.","plain":"Data extraction is where prompt engineering and structured outputs meet operational reality. The best pattern is usually: use deterministic parsing where you can, use Claude where context or normalization matters, then validate the result. 1. Decide whether the source is deterministic enough for a normal parser. 2. If not, ask Claude for structured output with a schema. 3. Validate the result in application code. 4. Normalize types, units, and formatting after extraction. 5. Log ambiguous or low-confidence cases for human review.","points":["Use Claude to identify the customer, product area, issue summary, and severity.","Return the result as JSON outputs.","Validate severity against an enum in code."]},{"tab":"Few-shot prompting vs extended thinking","title":"Few-shot prompting vs extended thinking","subtitle":"These are different levers: If the model understands the task but formats it incorrectly, add better examples.","plain":"These are different levers: If the model understands the task but formats it incorrectly, add better examples. If the model formats correctly but reasons poorly, increase effort or use thinking features.","points":["Few-shot prompting teaches format, policy, or style.","Adaptive / extended thinking gives the model more reasoning budget."]}],[{"tab":"Tool Use Fundamentals on Claude","title":"Tool Use Fundamentals on Claude","subtitle":"Claude can work with several kinds of tools: For client-side tool use in the Messages API:","plain":"Claude can work with several kinds of tools: For client-side tool use in the Messages API:","points":["auto: Claude chooses whether and when to call tools","any: Claude must use at least one tool","tool: force a named tool"]},{"tab":"The tool_use / tool_result contract","title":"The tool_use / tool_result contract","subtitle":"For client-side tool use in the Messages API: 1.","plain":"For client-side tool use in the Messages API: 1. You define tools with a name, description, and input_schema. 2. Claude decides to use one and returns stop_reason: \"tool_use\" plus one or more tool_use blocks. 3. Each tool_use block includes an id, name, and input object. 4. Your application executes the tool. 5. You send back a tool_result block that references the original tool_use_id.","points":["For client-side tool use in the Messages API: 1.","You define tools with a name, description, and input_schema.","2."]},{"tab":"What MCP Is","title":"What MCP Is","subtitle":"MCP is an open protocol for connecting AI applications to external systems in a standardized way.","plain":"MCP is an open protocol for connecting AI applications to external systems in a standardized way. Anthropic and the MCP project describe it as a way for tools like Claude Code to connect to data sources, tools, and workflows through MCP servers. In practice, the protocol is message-based and host/client/server oriented, so exam questions usually focus on roles, capabilities, transports, and configuration rather than low-level wire details. MCP servers can expose three main categories of capability:","points":["Tools: actions Claude can invoke","Resources: read-oriented content Claude can fetch and inspect","Prompts: reusable prompt templates or guided workflows"]},{"tab":"Core MCP capability types","title":"Core MCP capability types","subtitle":"MCP servers can expose three main categories of capability: In Claude Code, some MCP servers can also participate in channels so they can push messages into a session, and servers can send list_changed notifications so available capabilities refresh dynamically.","plain":"MCP servers can expose three main categories of capability: In Claude Code, some MCP servers can also participate in channels so they can push messages into a session, and servers can send list_changed notifications so available capabilities refresh dynamically.","points":["Tools: actions Claude can invoke","Resources: read-oriented content Claude can fetch and inspect","Prompts: reusable prompt templates or guided workflows"]},{"tab":"Transports in Claude Code","title":"Transports in Claude Code","subtitle":"Claude Code documents three practical ways to connect MCP servers:","plain":"Claude Code documents three practical ways to connect MCP servers:","points":["HTTP for remote servers (recommended for many cloud services)","SSE for remote streaming-style servers","stdio for local processes"]},{"tab":"Tool Design Best Practices","title":"Tool Design Best Practices","subtitle":"Good tool design matters because Claude relies heavily on descriptions and schema shape when deciding what to do.","plain":"Good tool design matters because Claude relies heavily on descriptions and schema shape when deciding what to do. over one giant ticket_api tool with many modes. Smaller tools are easier for Claude to choose correctly and easier for you to validate safely.","points":["create_ticket","get_ticket","list_open_tickets"]},{"tab":"Security and Reliability Considerations","title":"Security and Reliability Considerations","subtitle":"","plain":"","points":["Treat tool inputs as untrusted even when strict: true is enabled.","Validate again on the server side.","Keep secrets in environment variables or credential stores, not in prompts."]}],[{"tab":"Context as a Budget, Not a Dumping Ground","title":"Context as a Budget, Not a Dumping Ground","subtitle":"Long context is powerful, but it is not free.","plain":"Long context is powerful, but it is not free. Current Anthropic docs show:","points":["Larger prompts cost more and take longer.","Irrelevant history competes with the information Claude actually needs.","Tool-heavy sessions can bloat quickly because files, search results, and command output all consume context."]},{"tab":"Claude Code Tactics for Context Management","title":"Claude Code Tactics for Context Management","subtitle":"Claude Code loads more than just the visible conversation.","plain":"Claude Code loads more than just the visible conversation. According to the product docs, startup context can include: As Claude works, file reads, matching rules, tool results, and summaries also enter context.","points":["CLAUDE.md","auto memory","MCP tool names"]},{"tab":"Prompt caching","title":"Prompt caching","subtitle":"Prompt caching reduces latency and cost for repeated prefixes.","plain":"Prompt caching reduces latency and cost for repeated prefixes. Anthropic supports two patterns: Bad pattern: place the cache breakpoint on a block that changes every request, such as one with a timestamp or current user message.","points":["Automatic caching: add a top-level cache_control field","Explicit caching: place cache_control on specific cacheable blocks","Cached prefixes cover tools, then system, then messages."]},{"tab":"Context editing","title":"Context editing","subtitle":"Context editing is a separate beta feature that clears specific content instead of summarizing everything.","plain":"Context editing is a separate beta feature that clears specific content instead of summarizing everything. Current documented strategies include: Anthropic explicitly recommends server-side compaction as the default choice for most long-running conversations, and context editing as the more surgical option.","points":["Tool result clearing: remove old tool results when they no longer help reasoning","Thinking block clearing: decide how much prior thinking to preserve"]},{"tab":"Retry strategy by error class","title":"Retry strategy by error class","subtitle":"429 and 529 are not the same.","plain":"429 and 529 are not the same. The first is a rate-limit signal; the second indicates overload.","points":["429 and 529 are not the same.","The first is a rate-limit signal; the second indicates overload."]},{"tab":"Budgets and stop conditions","title":"Budgets and stop conditions","subtitle":"You should define budgets outside the model whenever possible.","plain":"You should define budgets outside the model whenever possible. In Claude Code print mode, the CLI exposes:","points":["--max-turns","--max-budget-usd","--fallback-model (documented for print mode only)"]},{"tab":"Permission modes","title":"Permission modes","subtitle":"Claude Code's documented permission modes are: plan is especially important for reliability because it lets Claude research and propose changes before it edits anything.","plain":"Claude Code's documented permission modes are: plan is especially important for reliability because it lets Claude research and propose changes before it edits anything. auto trades more autonomy for a classifier-backed safety layer. bypassPermissions is only appropriate in isolated environments you fully control.","points":["default","acceptEdits","plan"]},{"tab":"Monitoring and Observability","title":"Monitoring and Observability","subtitle":"Claude Code gives you several first-party observability tools: Anthropic also provides usage and cost APIs that are useful for budgeting and trend analysis.","plain":"Claude Code gives you several first-party observability tools: Anthropic also provides usage and cost APIs that are useful for budgeting and trend analysis.","points":["--debug for detailed logging","--verbose for turn-by-turn output","hooks for policy checks, audit logs, and custom telemetry"]}]];
    const ORIGINAL_EN_QUIZZES = [[{"src":"Domain 1 Practice Question 2","text":"What is the primary difference between building an agentic loop on the Messages API versus using the Agent SDK?","o":["The Messages API supports tool use; the Agent SDK does not","The Agent SDK manages the loop, sessions, and permissions; the Messages API is stateless and requires you to build those yourself","The Messages API automatically persists sessions to disk","The Agent SDK only supports single-turn interactions"],"a":1,"x":"The Messages API is stateless — every call must include the full conversation history, and session management is an application-level concern. The Agent SDK packages a production-grade agent loop with built-in tooling, permissions, hooks, subagents, and on-disk sessions. The core design choice is where the loop and session live: in your application (Messages API) or inside the SDK.","answerText":"The Agent SDK manages the loop, sessions, and permissions; the Messages API is stateless and requires you to build those yourself"},{"src":"Domain 1 Practice Question 3","text":"In the Agent SDK, what happens when both max_turns and max_budget_usd are set and the turn limit is reached first?","o":["The agent continues until the budget is also exhausted","The agent returns a ResultMessage with an error_max_turns subtype","The agent silently drops the remaining budget and exits","The SDK raises an unrecoverable exception"],"a":1,"x":"The Agent SDK provides explicit guardrails: max_turns caps tool-use round trips and max_budget_usd caps spend. Hitting either yields a ResultMessage with error subtypes like error_max_turns or error_max_budget_usd. Whichever limit is hit first triggers the stop — they do not both need to be exhausted.","answerText":"The agent returns a ResultMessage with an error_max_turns subtype"},{"src":"Domain 1 Practice Question 2","text":"What is the primary difference between building an agentic loop on the Messages API versus using the Agent SDK?","o":["The Messages API supports tool use; the Agent SDK does not","The Agent SDK manages the loop, sessions, and permissions; the Messages API is stateless and requires you to build those yourself","The Messages API automatically persists sessions to disk","The Agent SDK only supports single-turn interactions"],"a":1,"x":"The Messages API is stateless — every call must include the full conversation history, and session management is an application-level concern. The Agent SDK packages a production-grade agent loop with built-in tooling, permissions, hooks, subagents, and on-disk sessions. The core design choice is where the loop and session live: in your application (Messages API) or inside the SDK.","answerText":"The Agent SDK manages the loop, sessions, and permissions; the Messages API is stateless and requires you to build those yourself"},{"src":"Domain 1 Practice Question 1","text":"When Claude returns a stop_reason of \"tool_use\", what must your application include in the follow-up tool_result message?","o":["The tool's name and description","The tool_use_id from the original tool_use block","A new unique request_id generated by your application","The full conversation history up to that point"],"a":1,"x":"Claude's tool-use contract requires that every tool_result block references the original tool_use_id. This is the stable join key between Claude's intent and your execution layer. Without it, Claude cannot match the result to the request it made. The study guide explicitly states: \"tool results must reference it via tool_use_id.\"","answerText":"The tool_use_id from the original tool_use block"},{"src":"Domain 1 Practice Question 5","text":"How do Agent SDK subagents manage context relative to their parent agent?","o":["They share the parent's full conversation history","They receive a fresh context with only the Agent tool's prompt string; only the subagent's final message returns to the parent","They inherit the parent's history but cannot make tool calls","They run in the same context window as the parent"],"a":1,"x":"Subagents are context-isolated agent instances. A subagent's conversation is fresh (no parent history); only the Agent tool's prompt string bridges parent to subagent, and only the final subagent message returns to the parent. This is specifically valuable because intermediate tool calls and results stay within the subagent, controlling context growth.","answerText":"They receive a fresh context with only the Agent tool's prompt string; only the subagent's final message returns to the parent"},{"src":"Domain 1 Practice Question 6","text":"Which multi-agent organizational pattern does Anthropic's orchestrator-workers cookbook directly demonstrate?","o":["Peer-to-peer gossip protocol","Blackboard shared-workspace architecture","Master-worker pattern where a central agent decomposes tasks and delegates to specialized workers","Broker/message-bus publish-subscribe"],"a":2,"x":"Anthropic's cookbooks demonstrate the orchestrator-workers workflow where a central LLM decomposes tasks and delegates subtasks to specialized workers. This maps directly to the master-worker pattern in the comparison table and is directly supported by Agent SDK subagents.","answerText":"Master-worker pattern where a central agent decomposes tasks and delegates to specialized workers"},{"src":"Domain 1 Practice Question 7","text":"In the Agent SDK, what is the difference between \"continue,\" \"resume,\" and \"fork\" session operations?","o":["Continue finds the most recent session; resume targets a specific session by ID; fork copies history and diverges","Continue replays only tool results; resume replays all messages; fork deletes the original session","All three are aliases for the same operation","Continue starts fresh; resume appends; fork merges two sessions"],"a":0,"x":"The study guide defines these precisely: Continue finds the most recent session in the current directory. Resume resumes a specific session by ID, enabling multi-user apps where each user maps to a session ID. Fork creates a new session with a copy of history but diverges from that point. Importantly, forking history does not branch filesystem changes.","answerText":"Continue finds the most recent session; resume targets a specific session by ID; fork copies history and diverges"},{"src":"Domain 1 Practice Question 8","text":"Why should tool execution in an agentic loop be designed for idempotency?","o":["Claude always sends each tool call exactly twice","Tool calls can have side effects, and retries or replays should not re-execute operations that have already completed","The Messages API automatically retries all tool calls","Idempotent tools run faster than non-idempotent ones"],"a":1,"x":"Because tool calls can have side effects (DB writes, ticket creation), you should deduplicate by tool_use.id and record the executed result so retries can safely replay without re-executing. The Claude tool-use contract provides the stable identifier (tool_use.id) needed for this deduplication.","answerText":"Tool calls can have side effects, and retries or replays should not re-execute operations that have already completed"}],[{"src":"Domain 2 Practice Question 5","text":"What is the primary distinction between CLAUDE.md and settings.json in Claude Code's configuration hierarchy?","o":["CLAUDE.md is for team settings; settings.json is for personal preferences","CLAUDE.md provides contextual guidance (soft); settings.json provides client-enforced rules (strong)","CLAUDE.md is loaded first; settings.json is loaded last","They serve identical purposes but use different file formats"],"a":1,"x":"This distinction is exam-critical. CLAUDE.md shapes behavior through contextual guidance but is not a strict enforcement mechanism. Settings rules are enforced by the client. A common pattern is: put team-shared permissions, hooks, and MCP servers in project settings; use CLAUDE.md for conventions and workflows.","answerText":"CLAUDE.md provides contextual guidance (soft); settings.json provides client-enforced rules (strong)"},{"src":"Domain 2 Practice Question 2","text":"In a monorepo, when are CLAUDE.md files located in subdirectories loaded into context?","o":["At session start along with all other CLAUDE.md files","Only when explicitly imported with @path/to/file","Lazy-loaded on demand when Claude reads files in those subdirectories","Never — only the root CLAUDE.md is loaded"],"a":2,"x":"Subdirectory CLAUDE.md files are not loaded at launch. They are lazy-loaded when Claude reads files in those subdirectories. This is crucial for monorepos: package-specific content only appears when you work within that area, preventing irrelevant instructions from consuming context.","answerText":"Lazy-loaded on demand when Claude reads files in those subdirectories"},{"src":"Domain 2 Practice Question 1","text":"What is the recommended maximum line count for a single CLAUDE.md file according to Anthropic's guidance?","o":["50 lines","100 lines","~200 lines","500 lines"],"a":2,"x":"Anthropic recommends targeting under ~200 lines per CLAUDE.md for better adherence. Larger files consume context and reduce compliance. When instructions grow beyond this, the guidance is to split them using @imports or modular .claude/rules/ files.","answerText":"~200 lines"},{"src":"Domain 2 Practice Question 8","text":"How does the claudeMdExcludes setting work, and what is its limitation?","o":["It excludes all CLAUDE.md files including managed policy; configured per-session","It uses glob patterns to skip selected CLAUDE.md or rules paths, but managed policy CLAUDE.md cannot be excluded","It removes CLAUDE.md from version control","It only applies to subdirectory CLAUDE.md files and has no limitations"],"a":1,"x":"claudeMdExcludes uses glob patterns matched against absolute paths to skip selected CLAUDE.md or rules paths. Arrays merge across settings layers. However, managed policy CLAUDE.md (the organization-wide file at the OS-level path) cannot be excluded — this ensures enterprise governance cannot be bypassed.","answerText":"It uses glob patterns to skip selected CLAUDE.md or rules paths, but managed policy CLAUDE.md cannot be excluded"},{"src":"Domain 2 Practice Question 4","text":"If a skill and a legacy command (.claude/commands/*.md) share the same name, which takes precedence?","o":["The legacy command always wins","The skill takes precedence","Both are loaded and Claude chooses","An error is thrown at startup"],"a":1,"x":"Anthropic states that if a skill and a legacy command share the same name, the skill takes precedence. Legacy .claude/commands/*.md commands still work and are supported, but skills are the recommended format going forward with additional controls like frontmatter metadata and tool restrictions.","answerText":"The skill takes precedence"},{"src":"Domain 2 Practice Question 6","text":"What environment variable does Anthropic recommend setting in CI/CD automation contexts to prevent secrets from leaking into subprocess environments?","o":["CLAUDE_SAFE_MODE=1","CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1","ANTHROPIC_SCRUB_SECRETS=true","CLAUDE_SECURE_ENV=1"],"a":1,"x":"Anthropic provides CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 to strip Anthropic and cloud provider credentials from subprocess environments (Bash tool, hooks, MCP stdio servers). This explicitly reduces exposure to prompt injection attempts that could exfiltrate secrets via shell expansion.","answerText":"CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1"},{"src":"Domain 2 Practice Question 10","text":"Which official CI/CD integration for Claude Code is described as beta and maintained by a third party (not Anthropic)?","o":["GitHub Actions","Jenkins Plugin","GitLab CI/CD","CircleCI Orb"],"a":2,"x":"The GitLab CI/CD integration is described as beta and maintained by GitLab (not Anthropic). In contrast, the GitHub Actions integration (anthropics/claude-code-action@v1) is official and maintained by Anthropic. Jenkins and CircleCI have no first-party plugins — they use CLI/SDK patterns directly.","answerText":"GitLab CI/CD"}],[{"src":"Domain 3 Practice Question 1","text":"In the Claude Messages API, where is the system prompt specified?","o":["As a message with role: \"system\" in the messages array","As a top-level system parameter","In the output_config.system field","Embedded in the first user message"],"a":1,"x":"In the Messages API, the system prompt is a top-level system parameter, not a role: \"system\" message in the messages array. This is called out explicitly as one of the biggest exam traps — confusing the Messages API format with older or third-party API conventions.","answerText":"As a top-level system parameter"},{"src":"Domain 3 Practice Question 5","text":"When using few-shot prompting, what happens if the model understands the task but formats the output incorrectly?","o":["Increase the thinking budget","Add more representative examples that demonstrate the correct format","Switch to a larger model","Remove all examples and rely on instructions alone"],"a":1,"x":"The study guide draws a clear distinction: few-shot prompting teaches format, policy, or style; adaptive/extended thinking gives the model more reasoning budget. If the model understands the task but formats it incorrectly, the solution is better examples. If it formats correctly but reasons poorly, increase effort or use thinking features.","answerText":"Add more representative examples that demonstrate the correct format"},{"src":"Domain 3 Practice Question 2","text":"What is the correct way to configure JSON structured outputs in the current Messages API?","o":["Set response_format: \"json\" on the request","Use output_config.format with a json_schema type and schema definition","Add format: \"json\" to the system prompt","Use structured_output: true as a top-level parameter"],"a":1,"x":"The current Messages API uses output_config.format for JSON outputs. The SDK helpers may expose convenience wrappers (output_format / outputFormat), but these translate to the same API shape. Structured outputs use grammar-constrained decoding to enforce schema conformance.","answerText":"Use output_config.format with a json_schema type and schema definition"},{"src":"Domain 3 Practice Question 3","text":"What is the difference between JSON outputs and strict tool use?","o":["They are the same feature with different names","JSON outputs constrain Claude's final answer text; strict tool use constrains tool argument schemas","JSON outputs work with tools; strict tool use works with text responses","Strict tool use is deprecated in favor of JSON outputs"],"a":1,"x":"These solve different problems. JSON outputs (via output_config.format) constrain what Claude says in its response. Strict tool use (via strict: true on a tool definition) constrains how Claude calls functions — specifically the tool name and argument schema. They can be used independently or together in the same workflow.","answerText":"JSON outputs constrain Claude's final answer text; strict tool use constrains tool argument schemas"},{"src":"Domain 3 Practice Question 7","text":"In a data extraction pipeline, when should you use Claude with a schema versus a deterministic parser (regex, native JSON/XML parser)?","o":["Always use Claude — it handles all formats better","Use deterministic parsers for stable, structured sources; use Claude for messy documents requiring contextual understanding","Always use regex first, then Claude as a fallback","Use Claude only when the document is in PDF format"],"a":1,"x":"The recommended extraction pattern is: use deterministic parsing where you can, use Claude where context or normalization matters, then validate the result. Regex is best for stable string patterns; native parsers for structured formats; Claude with schemas for messy documents needing contextual extraction.","answerText":"Use deterministic parsers for stable, structured sources; use Claude for messy documents requiring contextual understanding"},{"src":"Domain 3 Practice Question 8","text":"What is the recommended approach for reasoning on Claude Opus 4.6 and Sonnet 4.6?","o":["Set thinking=true on the request","Use adaptive thinking with the effort parameter","Add \"think step by step\" to the prompt","Enable reasoning_mode: \"extended\" in settings"],"a":1,"x":"For Claude Opus 4.6 and Sonnet 4.6, Anthropic recommends adaptive thinking with the effort parameter over the older manual thinking mode. The thinking=true pattern is outdated and incorrect — this is explicitly flagged as one of the biggest exam traps.","answerText":"Use adaptive thinking with the effort parameter"}],[{"src":"Domain 4 Practice Question 5","text":"Why does Anthropic recommend designing single-purpose tools rather than one large multi-mode tool?","o":["Claude can only call one tool per turn","Smaller tools are easier for Claude to choose correctly and easier for you to validate safely","Multi-mode tools are not supported by the Messages API","Single-purpose tools use less context"],"a":1,"x":"Good tool design matters because Claude relies heavily on descriptions and schema shape when deciding what to do. The study guide recommends preferring separate create_ticket, get_ticket, list_open_tickets tools over one giant ticket_api tool with many modes. Smaller, focused tools are easier for Claude to route correctly and easier for you to secure and validate.","answerText":"Smaller tools are easier for Claude to choose correctly and easier for you to validate safely"},{"src":"Domain 4 Practice Question 2","text":"When Claude returns a tool_use block, what unique identifier must be referenced in the corresponding tool_result?","o":["request_id","tool_name","tool_use_id","session_id"],"a":2,"x":"The tool_use_id is the join key between Claude's intent and your execution layer. Each tool_use block includes an id, and your tool_result must reference it so Claude can match the result to the specific tool call it requested.","answerText":"tool_use_id"},{"src":"Domain 4 Practice Question 1","text":"In the Claude ecosystem, what does MCP stand for?","o":["Managed Control Plane","Model Context Protocol","Multi-Channel Pipeline","Message Communication Platform"],"a":1,"x":"In the Claude ecosystem, MCP means Model Context Protocol — an open standard for connecting AI applications to external tools, data sources, and workflows. It does not mean \"managed control plane.\" This is explicitly called out as a common exam trap.","answerText":"Model Context Protocol"},{"src":"Domain 4 Practice Question 3","text":"What are the three core capability types that MCP servers can expose?","o":["Tools, Resources, and Prompts","Tools, Schemas, and Endpoints","Actions, Events, and Logs","Commands, Queries, and Subscriptions"],"a":0,"x":"MCP servers can expose three main categories of capability: Tools (actions Claude can invoke), Resources (read-oriented content Claude can fetch and inspect), and Prompts (reusable prompt templates or guided workflows). Understanding the distinction between these three is important for choosing the right mechanism for each integration.","answerText":"Tools, Resources, and Prompts"},{"src":"Domain 4 Practice Question 4","text":"Which transport type does Claude Code recommend for remote MCP servers like cloud SaaS integrations?","o":["stdio","WebSocket","HTTP","gRPC"],"a":2,"x":"Claude Code documents three transport types: HTTP for remote servers (recommended for many cloud services), SSE for remote streaming-style servers, and stdio for local processes. HTTP is the recommended transport for remote SaaS integrations like GitHub, Notion, and Stripe.","answerText":"HTTP"},{"src":"Domain 4 Practice Question 5","text":"Why does Anthropic recommend designing single-purpose tools rather than one large multi-mode tool?","o":["Claude can only call one tool per turn","Smaller tools are easier for Claude to choose correctly and easier for you to validate safely","Multi-mode tools are not supported by the Messages API","Single-purpose tools use less context"],"a":1,"x":"Good tool design matters because Claude relies heavily on descriptions and schema shape when deciding what to do. The study guide recommends preferring separate create_ticket, get_ticket, list_open_tickets tools over one giant ticket_api tool with many modes. Smaller, focused tools are easier for Claude to route correctly and easier for you to secure and validate.","answerText":"Smaller tools are easier for Claude to choose correctly and easier for you to validate safely"},{"src":"Domain 4 Practice Question 9","text":"Why should tool inputs be validated even when strict: true is enabled on the tool definition?","o":["strict: true only validates output schemas, not inputs","strict: true constrains the model's output, but server-side validation is still needed as a defense-in-depth practice","strict: true is not actually enforced by the API","Tool inputs are always trusted when sent by Claude"],"a":1,"x":"The study guide states: \"Treat tool inputs as untrusted even when strict: true is enabled. Validate again on the server side.\" strict: true uses grammar-constrained decoding to enforce schema conformance on Claude's side, but defense-in-depth requires server-side validation as well. This is a security best practice for all tool implementations.","answerText":"strict: true constrains the model's output, but server-side validation is still needed as a defense-in-depth practice"}],[{"src":"Domain 5 Practice Question 1","text":"What is \"context rot\" in the context of Claude sessions?","o":["A bug that causes Claude to lose access to tools","The degradation of accuracy and focus as irrelevant context accumulates in long conversations","A file corruption issue with session storage","The expiration of cached prompts after 5 minutes"],"a":1,"x":"The study guide states that even with 1M-context variants, context is still a constrained resource. More tokens increase cost and latency, and overly long conversations can reduce focus — this is what \"context rot\" describes. The exam-relevant principle is: keep the most relevant history available at the lowest safe cost, not keep as much history as possible.","answerText":"The degradation of accuracy and focus as irrelevant context accumulates in long conversations"},{"src":"Domain 5 Practice Question 4","text":"How does server-side compaction work in the Messages API?","o":["It deletes old messages from storage","It summarizes older context when tokens cross a threshold, returns a compaction block, and expects you to pass it back on subsequent requests","It compresses the entire conversation into a single system prompt","It automatically truncates messages from the beginning"],"a":1,"x":"Server-side compaction works in four steps: (1) the API notices input tokens crossed a trigger threshold, (2) Claude summarizes older context, (3) the response includes a compaction block, (4) you pass that block back on the next request so the API can ignore earlier content. This is currently supported on Claude Opus 4.6 and Sonnet 4.6.","answerText":"It summarizes older context when tokens cross a threshold, returns a compaction block, and expects you to pass it back on subsequent requests"},{"src":"Domain 5 Practice Question 2","text":"What is the default TTL for prompt caching in Claude's API?","o":["1 minute","5 minutes","30 minutes","24 hours"],"a":1,"x":"The default TTL for prompt caching is 5 minutes. Anthropic also supports a 1-hour cache duration. Caching works best when the cached prefix is genuinely stable across requests. Placing cache breakpoints on blocks that change every request (like timestamps) defeats the purpose.","answerText":"5 minutes"},{"src":"Domain 5 Practice Question 5","text":"What is the difference between server-side compaction and context editing?","o":["They are the same feature with different API names","Compaction summarizes everything broadly; context editing surgically clears specific content like old tool results or thinking blocks","Context editing is for system prompts; compaction is for user messages","Compaction is client-side; context editing is server-side"],"a":1,"x":"These are separate beta features. Compaction summarizes and replaces older context holistically. Context editing provides fine-grained clearing strategies (tool-result clearing, thinking-block clearing). Anthropic recommends server-side compaction as the default for most long-running conversations and context editing as the more surgical option.","answerText":"Compaction summarizes everything broadly; context editing surgically clears specific content like old tool results or thinking blocks"},{"src":"Domain 5 Practice Question 6","text":"What is the correct response when Claude Code receives an HTTP 429 error from the API?","o":["Immediately retry the request","Respect the retry-after header, back off with jitter, and reduce concurrency","Switch to a different model","Restart the session from scratch"],"a":1,"x":"HTTP 429 is a rate-limit signal. The recommended action is to respect the retry-after header, back off with jitter, and reduce concurrency. Immediately retrying without backoff will make the problem worse and may extend the rate limiting period.","answerText":"Respect the retry-after header, back off with jitter, and reduce concurrency"},{"src":"Domain 5 Practice Question 8","text":"In Claude Code print mode, which flag specifies a model to fall back to if the primary model is unavailable?","o":["--backup-model","--secondary-model","--fallback-model","--alt-model"],"a":2,"x":"In Claude Code print mode, --fallback-model specifies a model to fall back to if the primary model is unavailable. The study guide notes this is documented for print mode specifically, not as a universal behavior across all surfaces — a distinction the exam may test.","answerText":"--fallback-model"},{"src":"Domain 5 Practice Question 7","text":"Which Claude Code permission mode allows Claude to research and propose changes without executing them?","o":["default","auto","plan","dontAsk"],"a":2,"x":"The plan permission mode lets Claude research and propose changes before editing anything. This is especially important for reliability because it enables review before execution. auto provides more autonomy with a classifier-backed safety layer. bypassPermissions is only appropriate in fully isolated environments.","answerText":"plan"},{"src":"Domain 5 Practice Question 10","text":"What is the key difference between HTTP 429 and HTTP 529 errors from Claude's API?","o":["They are identical in meaning and handling","429 is a rate-limit signal; 529 indicates service overload — different causes requiring different handling strategies","429 means authentication failure; 529 means rate limiting","429 is deprecated; 529 has replaced it"],"a":1,"x":"The study guide explicitly states: \"429 and 529 are not the same. The first is a rate-limit signal; the second indicates overload.\" For 429, respect retry-after and reduce concurrency. For 529, retry with backoff and jitter, and consider a fallback model or delayed queueing. Conflating these two errors leads to incorrect retry strategies.","answerText":"429 is a rate-limit signal; 529 indicates service overload — different causes requiring different handling strategies"}]];
